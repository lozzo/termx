syntax = "proto3";

package termx.cloud.v1;

option go_package = "github.com/lozzow/termx/proto/cloudpb";


// ObservedPath 是一次 WebRTC transport 实际采用的网络路径。
enum ObservedPath {
  OBSERVED_PATH_UNSPECIFIED = 0;
  OBSERVED_PATH_DIRECT = 1;
  OBSERVED_PATH_SINGLE_RELAY = 2;
  OBSERVED_PATH_RELAY_MESH = 3;
}

// Availability 表示最后一次经过验证的在线证据，不能由超时直接推导 OFFLINE。
enum Availability {
  AVAILABILITY_UNSPECIFIED = 0;
  AVAILABILITY_ONLINE = 1;
  AVAILABILITY_OFFLINE = 2;
  AVAILABILITY_UNKNOWN = 3;
}

// Freshness 表示投影是否仍处于有效观察窗口。
enum Freshness {
  FRESHNESS_UNSPECIFIED = 0;
  FRESHNESS_FRESH = 1;
  FRESHNESS_STALE = 2;
}

// ObservationSource 标识状态证据来源，不授予任何 terminal capability。
enum ObservationSource {
  OBSERVATION_SOURCE_UNSPECIFIED = 0;
  OBSERVATION_SOURCE_HUB_OPEN = 1;
  OBSERVATION_SOURCE_HUB_CLOSE = 2;
  OBSERVATION_SOURCE_HUB_TOPOLOGY_SNAPSHOT = 3;
  OBSERVATION_SOURCE_CONTROL_STREAM_LOST = 4;
  OBSERVATION_SOURCE_DAEMON_INVENTORY = 5;
  OBSERVATION_SOURCE_DAEMON_LIFECYCLE_EVENT = 6;
}

// ManagedDeviceKind 区分账号目录中的连接发起端与 daemon 目标；类型不表达 terminal capability。
// 该枚举位于 topology schema，供 companion、Hub policy 与 management API 共同消费，避免 schema 循环依赖。
enum ManagedDeviceKind {
  MANAGED_DEVICE_KIND_UNSPECIFIED = 0;
  MANAGED_DEVICE_KIND_CLIENT = 1;
  MANAGED_DEVICE_KIND_DAEMON = 2;
}

// ManagedPeerSessionState 是 daemon-owned managed WebRTC session 的脱敏投影状态。
enum ManagedPeerSessionState {
  MANAGED_PEER_SESSION_STATE_UNSPECIFIED = 0;
  MANAGED_PEER_SESSION_STATE_AUTHENTICATED = 1;
  MANAGED_PEER_SESSION_STATE_READY = 2;
  MANAGED_PEER_SESSION_STATE_CLOSING = 3;
  MANAGED_PEER_SESSION_STATE_CLOSED = 4;
  MANAGED_PEER_SESSION_STATE_UNKNOWN = 5;
  MANAGED_PEER_SESSION_STATE_SUPERSEDED = 6;
}

// TerminalAccessState 是 daemon AccessStore 提供的最小 deny-only 管理投影状态。
enum TerminalAccessState {
  TERMINAL_ACCESS_STATE_UNSPECIFIED = 0;
  TERMINAL_ACCESS_STATE_ACTIVE = 1;
  TERMINAL_ACCESS_STATE_REVOKED = 2;
  TERMINAL_ACCESS_STATE_EXPIRED = 3;
}

// ExactSessionCloseDisposition 描述精确 session fencing 的关闭请求结果。
enum ExactSessionCloseDisposition {
  EXACT_SESSION_CLOSE_DISPOSITION_UNSPECIFIED = 0;
  EXACT_SESSION_CLOSE_DISPOSITION_REQUESTED = 1;
  EXACT_SESSION_CLOSE_DISPOSITION_ALREADY_CLOSED = 2;
  EXACT_SESSION_CLOSE_DISPOSITION_STALE_TARGET = 3;
  EXACT_SESSION_CLOSE_DISPOSITION_NOT_FOUND = 4;
}

// PresenceProjection 是 Control Plane 可展示的 daemon Presence 投影。
message PresenceProjection {
  string daemon_device_id = 1;
  string control_owner_hub_id = 2;
  uint64 assignment_epoch = 3;
  string presence_session_id = 4;
  Availability availability = 5;
  Freshness freshness = 6;
  ObservationSource observation_source = 7;
  int64 observed_at_unix_millis = 8;
  int64 fresh_until_unix_millis = 9;
  string daemon_runtime_generation = 10;
  uint64 registry_revision = 11;
}

// ManagedPeerSessionTarget 是 command 与 registry 共用的精确 session 主键。
message ManagedPeerSessionTarget {
  string daemon_device_id = 1;
  string managed_session_id = 2;
  uint64 session_incarnation = 3;
  uint64 assignment_epoch = 4;
  string control_presence_session_id = 5;
  string daemon_runtime_generation = 6;
}

// ManagedPeerSessionProjection 不包含 SDP、ICE、IP、terminal、file 或 capability 内容。
message ManagedPeerSessionProjection {
  ManagedPeerSessionTarget target = 1;
  string client_device_id = 2;
  string established_presence_session_id = 3;
  string authenticated_client_fingerprint = 4;
  string opaque_access_reference = 5;
  string control_owner_hub_id = 6;
  ObservedPath observed_data_path = 7;
  ManagedPeerSessionState state = 8;
  Freshness freshness = 9;
  int64 connected_at_unix_millis = 10;
  int64 observed_at_unix_millis = 11;
  int64 fresh_until_unix_millis = 12;
  string close_reason_code = 13;
  string relay_lease_id = 14;
}

// PeerSessionInventorySnapshot 是一个 daemon runtime revision 的完整 session 替换集。
message PeerSessionInventorySnapshot {
  string report_id = 1;
  string daemon_device_id = 2;
  string control_owner_hub_id = 3;
  uint64 assignment_epoch = 4;
  string control_presence_session_id = 5;
  string daemon_runtime_generation = 6;
  uint64 registry_revision = 7;
  repeated ManagedPeerSessionProjection sessions = 8;
  int64 observed_at_unix_millis = 9;
}

// PeerSessionLifecycleEvent 与 inventory 共用 daemon runtime generation 和 registry revision。
message PeerSessionLifecycleEvent {
  string event_id = 1;
  string daemon_device_id = 2;
  string control_owner_hub_id = 3;
  uint64 assignment_epoch = 4;
  string control_presence_session_id = 5;
  string daemon_runtime_generation = 6;
  uint64 registry_revision = 7;
  ManagedPeerSessionProjection session = 8;
  int64 observed_at_unix_millis = 9;
}

// TerminalAccessProjection 是 daemon AccessStore 的脱敏管理条目。
message TerminalAccessProjection {
  string daemon_device_id = 1;
  string opaque_access_reference = 2;
  string client_label = 3;
  string subject_fingerprint_summary = 4;
  TerminalAccessState state = 5;
  int64 issued_at_unix_millis = 6;
  int64 expires_at_unix_millis = 7;
  uint64 access_projection_revision = 8;
}

// TerminalAccessInventorySnapshot 是一个 daemon AccessStore revision 的完整替换集。
message TerminalAccessInventorySnapshot {
  string report_id = 1;
  string daemon_device_id = 2;
  string control_owner_hub_id = 3;
  uint64 assignment_epoch = 4;
  string control_presence_session_id = 5;
  string daemon_runtime_generation = 6;
  uint64 registry_revision = 7;
  uint64 access_projection_revision = 8;
  repeated TerminalAccessProjection accesses = 9;
  int64 observed_at_unix_millis = 10;
}

// HubTopologySnapshot 是当前 Hub control generation 的完整拓扑协调快照。
message HubTopologySnapshot {
  string hub_id = 1;
  uint64 control_generation = 2;
  uint64 topology_revision = 3;
  bytes topology_digest = 4;
  int64 observed_at_unix_millis = 5;
  repeated PresenceProjection presences = 6;
  repeated ManagedPeerSessionProjection peer_sessions = 7;
  repeated TerminalAccessInventorySnapshot terminal_access_inventories = 8;
}

// ReportDaemonRuntimeRequest 是 daemon Presence 上行的完整 runtime replacement。
message ReportDaemonRuntimeRequest {
  string report_id = 1;
  string hub_id = 2;
  uint64 assignment_epoch = 3;
  string presence_session_id = 4;
  string daemon_runtime_generation = 5;
  uint64 registry_revision = 6;
  PeerSessionInventorySnapshot peer_sessions = 7;
  TerminalAccessInventorySnapshot terminal_accesses = 8;
}

// ReportDaemonRuntimeResponse 只确认已接收的精确 runtime revision。
message ReportDaemonRuntimeResponse {
  string report_id = 1;
  string daemon_runtime_generation = 2;
  uint64 accepted_registry_revision = 3;
  uint64 accepted_access_projection_revision = 4;
}

// ExactSessionCloseResult 是 registry 对精确 close target 的线性化结果。
message ExactSessionCloseResult {
  ManagedPeerSessionTarget target = 1;
  ExactSessionCloseDisposition disposition = 2;
  uint64 registry_revision = 3;
  string reason_code = 4;
}
