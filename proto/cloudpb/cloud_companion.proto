syntax = "proto3";

package termx.cloud.v1;

option go_package = "github.com/lozzow/termx/proto/cloudpb";

// CallerRole 标识当前 IPC 连接代表的公开进程角色。
enum CallerRole {
  CALLER_ROLE_UNSPECIFIED = 0;
  CALLER_ROLE_TUI = 1;
  CALLER_ROLE_CLI = 2;
  CALLER_ROLE_DAEMON = 3;
  CALLER_ROLE_MOBILE_APP = 4;
}

// CompanionCapability 是公开进程与 companion 协商的最小能力集合。
enum CompanionCapability {
  COMPANION_CAPABILITY_UNSPECIFIED = 0;
  COMPANION_CAPABILITY_ACCOUNT_SESSION = 1;
  COMPANION_CAPABILITY_DEVICE_PRESENCE = 2;
  COMPANION_CAPABILITY_SIGNALING = 3;
  COMPANION_CAPABILITY_RELAY_LEASE = 4;
  COMPANION_CAPABILITY_PATH_QUALITY = 5;
  COMPANION_CAPABILITY_SMART_ROUTE = 6;
  COMPANION_CAPABILITY_DEVICE_ENROLLMENT = 7;
  COMPANION_CAPABILITY_DEVICE_DIRECTORY = 8;
}

// CompanionState 描述 companion 本地安装与账号会话状态。
enum CompanionState {
  COMPANION_STATE_UNSPECIFIED = 0;
  COMPANION_STATE_READY = 1;
  COMPANION_STATE_LOGIN_REQUIRED = 2;
  COMPANION_STATE_DEVICE_ENROLLMENT_REQUIRED = 3;
  COMPANION_STATE_INCOMPATIBLE = 4;
  COMPANION_STATE_UNAVAILABLE = 5;
}

// CloudErrorCode 是 public runtime 可以稳定分支处理的 cloud 错误分类。
enum CloudErrorCode {
  CLOUD_ERROR_CODE_UNSPECIFIED = 0;
  CLOUD_ERROR_CODE_COMPANION_MISSING = 1;
  CLOUD_ERROR_CODE_COMPANION_NOT_RUNNING = 2;
  CLOUD_ERROR_CODE_COMPANION_INCOMPATIBLE = 3;
  CLOUD_ERROR_CODE_COMPANION_UNTRUSTED = 4;
  CLOUD_ERROR_CODE_LOGIN_REQUIRED = 5;
  CLOUD_ERROR_CODE_DEVICE_ENROLLMENT_REQUIRED = 6;
  CLOUD_ERROR_CODE_UNAUTHENTICATED = 7;
  CLOUD_ERROR_CODE_DEVICE_NOT_FOUND = 8;
  CLOUD_ERROR_CODE_ENTITLEMENT_DENIED = 9;
  CLOUD_ERROR_CODE_QUOTA_EXHAUSTED = 10;
  CLOUD_ERROR_CODE_REGION_UNAVAILABLE = 11;
  CLOUD_ERROR_CODE_ROUTE_UNAVAILABLE = 12;
  CLOUD_ERROR_CODE_BACKPRESSURE = 13;
  CLOUD_ERROR_CODE_PROTOCOL = 14;
  CLOUD_ERROR_CODE_TEMPORARY = 15;
}

// PresenceState 是 Control Plane/Hub 提供的最小设备在线投影。
enum PresenceState {
  PRESENCE_STATE_UNSPECIFIED = 0;
  PRESENCE_STATE_OFFLINE = 1;
  PRESENCE_STATE_ONLINE = 2;
}

// ManagedDeviceKind 区分账号目录中的连接发起端与 daemon 目标；类型不表达 terminal capability。
enum ManagedDeviceKind {
  MANAGED_DEVICE_KIND_UNSPECIFIED = 0;
  MANAGED_DEVICE_KIND_CLIENT = 1;
  MANAGED_DEVICE_KIND_DAEMON = 2;
}

// ObservedPath 是一次 WebRTC transport 实际采用的网络路径。
enum ObservedPath {
  OBSERVED_PATH_UNSPECIFIED = 0;
  OBSERVED_PATH_DIRECT = 1;
  OBSERVED_PATH_SINGLE_RELAY = 2;
  OBSERVED_PATH_RELAY_MESH = 3;
}

// RoutePreference 描述调用方允许的付费路径上限，不表达 terminal scope。
enum RoutePreference {
  ROUTE_PREFERENCE_UNSPECIFIED = 0;
  ROUTE_PREFERENCE_DIRECT_ONLY = 1;
  ROUTE_PREFERENCE_STANDARD_RELAY = 2;
  ROUTE_PREFERENCE_SMART_ROUTE = 3;
  ROUTE_PREFERENCE_GLOBAL_ACCELERATOR = 4;
}

// RouteSelectionReason 是公开诊断可见的稳定选路原因，不暴露私有评分权重或商业成本。
enum RouteSelectionReason {
  ROUTE_SELECTION_REASON_UNSPECIFIED = 0;
  ROUTE_SELECTION_REASON_INITIAL_BEST = 1;
  ROUTE_SELECTION_REASON_ONLY_VIABLE = 2;
  ROUTE_SELECTION_REASON_LOWER_LOSS = 3;
  ROUTE_SELECTION_REASON_DIRECT_UNSTABLE = 4;
  ROUTE_SELECTION_REASON_LOWER_LATENCY = 5;
  ROUTE_SELECTION_REASON_LOWER_SCORE = 6;
  ROUTE_SELECTION_REASON_COST_GUARD = 7;
  ROUTE_SELECTION_REASON_MINIMUM_HOLD = 8;
  ROUTE_SELECTION_REASON_COOLDOWN = 9;
  ROUTE_SELECTION_REASON_HYSTERESIS_HOLD = 10;
  ROUTE_SELECTION_REASON_INSUFFICIENT_IMPROVEMENT = 11;
  ROUTE_SELECTION_REASON_CURRENT_UNAVAILABLE = 12;
  ROUTE_SELECTION_REASON_CURRENT_BEST = 13;
}

// LoginMethod 是 Companion 支持的官方账号登录交互方式。
enum LoginMethod {
  LOGIN_METHOD_UNSPECIFIED = 0;
  LOGIN_METHOD_BROWSER = 1;
  LOGIN_METHOD_DEVICE_CODE = 2;
}

// DiagnosticSeverity 是 doctor 返回的脱敏诊断级别。
enum DiagnosticSeverity {
  DIAGNOSTIC_SEVERITY_UNSPECIFIED = 0;
  DIAGNOSTIC_SEVERITY_INFO = 1;
  DIAGNOSTIC_SEVERITY_WARNING = 2;
  DIAGNOSTIC_SEVERITY_ERROR = 3;
}

// CloudError 包含稳定错误码和可脱敏展示的最小诊断信息。
message CloudError {
  CloudErrorCode code = 1;
  string message = 2;
  bool retryable = 3;
  uint64 retry_after_millis = 4;
  string correlation_id = 5;
}

// CompanionHelloRequest 是每条本地 IPC 连接的首个请求。
message CompanionHelloRequest {
  uint32 protocol_min = 1;
  uint32 protocol_max = 2;
  string termx_version = 3;
  CallerRole caller_role = 4;
  repeated CompanionCapability requested_capabilities = 5;
  bytes request_nonce = 6;
}

// CompanionHelloResponse 固定本连接使用的 protocol version 和能力子集。
message CompanionHelloResponse {
  uint32 selected_protocol = 1;
  string companion_version = 2;
  repeated CompanionCapability supported_capabilities = 3;
  string build_channel = 4;
  bytes response_nonce = 5;
}

// StatusRequest 查询本地 companion 状态，不携带账号 token。
message StatusRequest {}

// StatusResponse 返回可展示的账号与设备会话摘要。
message StatusResponse {
  CompanionState state = 1;
  string account_label = 2;
  string account_id = 3;
  string device_id = 4;
  uint64 session_expires_at_unix = 5;
  repeated CompanionCapability capabilities = 6;
}

// BeginLoginRequest 启动 browser 或 device-code 登录，不携带账号 token。
message BeginLoginRequest {
  LoginMethod method = 1;
  // client_metadata 只用于浏览器批准页展示申请客户端，不进入 Hub 或 terminal capability。
  DeviceMetadata client_metadata = 2;
}

// LoginFlow 返回用户可见的官方登录入口和短期 flow reference。
message LoginFlow {
  string flow_id = 1;
  string verification_uri = 2;
  string user_code = 3;
  uint64 expires_at_unix = 4;
  uint64 poll_interval_millis = 5;
}

// CompleteLoginRequest 请求 Companion 完成指定登录 flow。
message CompleteLoginRequest {
  string flow_id = 1;
}

// ClaimMobileActivationRequest 让 Official App 认领已登录 Web 创建的短期激活码。
// user_code 只是活动 Flow locator；Control Plane 在响应中才把高熵 flow_id 交给原生层。
message ClaimMobileActivationRequest {
  string user_code = 1;
  DeviceMetadata client_metadata = 2;
}

// CloudSessionSummary 是可以进入 CLI/App 状态展示的非秘密会话摘要。
message CloudSessionSummary {
  string account_label = 1;
  string account_id = 2;
  string device_id = 3;
  uint64 expires_at_unix = 4;
}

// CompleteLoginResponse 确认账号会话已写入 Companion 的 OS credential store。
message CompleteLoginResponse {
  CloudSessionSummary session = 1;
}

// BeginDeviceEnrollmentRequest 提交一次性 enrollment code 与公开设备信息。
// DeviceIdentity 私钥和 capability grant 不得进入该消息。
message BeginDeviceEnrollmentRequest {
  string one_time_code = 1;
  bytes device_public_key = 2;
  DeviceMetadata metadata = 3;
}

// DeviceEnrollmentChallenge 是公开 daemon 必须使用 DeviceIdentity 签名的短期挑战。
message DeviceEnrollmentChallenge {
  string flow_id = 1;
  string challenge_id = 2;
  bytes challenge = 3;
  uint64 expires_at_unix = 4;
}

// DeviceEnrollmentProofInput 是公开 daemon 生成 DeviceProof signature 的 deterministic 输入。
// 该消息只用于本地签名/服务端验签，不包含 private key、capability 或 terminal 数据。
message DeviceEnrollmentProofInput {
  string flow_id = 1;
  string challenge_id = 2;
  bytes challenge = 3;
  string device_id = 4;
  bytes device_public_key = 5;
  int64 signed_at_unix_nano = 6;
}

// CompleteDeviceEnrollmentRequest 返回公开 daemon 生成的 DeviceProof。
message CompleteDeviceEnrollmentRequest {
  string flow_id = 1;
  DeviceProof proof = 2;
}

// CompleteDeviceEnrollmentResponse 确认 device 云会话已写入 OS credential store。
message CompleteDeviceEnrollmentResponse {
  CloudSessionSummary session = 1;
}

// LogoutRequest 显式选择要删除的账号或 daemon device 云会话。
// 它不删除 DeviceIdentity、CapabilityGrant 或 endpoint 配置。
message LogoutRequest {
  bool account_session = 1;
  bool device_session = 2;
}

// LogoutResponse 确认选中的 Companion 云会话已删除。
message LogoutResponse {}

// DoctorRequest 请求不含 secret body 的本地 Companion 诊断。
message DoctorRequest {}

// DiagnosticItem 是固定 code、级别和 reference 组成的脱敏诊断项。
message DiagnosticItem {
  string code = 1;
  DiagnosticSeverity severity = 2;
  string message = 3;
  string reference = 4;
}

// DoctorResponse 返回当前连接可见的状态和脱敏诊断。
message DoctorResponse {
  StatusResponse status = 1;
  repeated DiagnosticItem items = 2;
}

// ShutdownRequest 请求当前用户的 Companion 进程有序退出。
message ShutdownRequest {
  string reason = 1;
}

// ShutdownResponse 确认退出请求已被本地进程接收。
message ShutdownResponse {}

// DeviceProof 是 daemon 使用 DeviceIdentity 对 cloud challenge 的签名结果。
message DeviceProof {
  string device_id = 1;
  bytes device_public_key = 2;
  string challenge_id = 3;
  bytes signature = 4;
  int64 signed_at_unix_nano = 5;
}

// BeginPresenceRequest 让已 enrollment 的公开 daemon 为一次新的 Hub presence 请求挑战。
// DeviceIdentity 私钥不进入该消息；device_id 必须与 Companion device cloud session 一致。
message BeginPresenceRequest {
  string device_id = 1;
}

// PresenceChallenge 是 Control Plane 为一个 device-scoped PresenceSession 签发的一次性挑战。
// PresenceSession 先于任何 client ManagedSession 存在，两者不得复用 ID。
message PresenceChallenge {
  string presence_session_id = 1;
  string challenge_id = 2;
  bytes challenge = 3;
  uint64 expires_at_unix = 4;
}

// PresenceProofInput 是公开 daemon 生成 fresh presence proof signature 的 deterministic 输入。
// 该消息不包含 capability、terminal metadata、账号 token 或 DeviceIdentity private key。
message PresenceProofInput {
  string presence_session_id = 1;
  string challenge_id = 2;
  bytes challenge = 3;
  string device_id = 4;
  bytes device_public_key = 5;
  int64 signed_at_unix_nano = 6;
}

// DeviceMetadata 是设备目录允许保存的最小公开信息。
message DeviceMetadata {
  string display_name = 1;
  string hostname = 2;
  string platform = 3;
  string termx_version = 4;
  repeated uint32 signaling_versions = 5;
}

// ResolveEndpointRequest 请求定位目标 daemon，不携带 capability。
message ResolveEndpointRequest {
  string endpoint_id = 1;
  string target_device_id = 2;
}

// ListManagedDevicesRequest 请求当前 edge credential 所属账号的最小设备目录。
message ListManagedDevicesRequest {
  uint32 schema_version = 1;
}

// ManagedDevice 是 Hub 已签名内存投影与 active Presence 的交集，不含 terminal 或 capability。
message ManagedDevice {
  string device_id = 1;
  string display_name = 2;
  string platform = 3;
  ManagedDeviceKind kind = 4;
  PresenceState presence = 5;
  bool revoked = 6;
}

// ListManagedDevicesResponse 只返回同账号设备；client 用于管理，daemon 用于连接发现。
message ListManagedDevicesResponse {
  repeated ManagedDevice devices = 1;
}

// IceServer 是公开 WebRTC adapter 可以使用的短期 STUN/TURN 配置。
message IceServer {
  repeated string urls = 1;
  string username = 2;
  string credential = 3;
}

// ResolvedEndpoint 是 cloud directory 的路由结果，不是设备信任证明。
message ResolvedEndpoint {
  string endpoint_id = 1;
  string target_device_id = 2;
  PresenceState presence = 3;
  string hub_id = 4;
  string hub_url = 5;
  string managed_session_id = 6;
  repeated IceServer ice_servers = 7;
}

// OpenPresenceRequest 让 companion 为一个已证明身份的 daemon 打开 presence stream。
message OpenPresenceRequest {
  string presence_session_id = 1;
  DeviceProof proof = 2;
  DeviceMetadata metadata = 3;
}

// PresenceReady 表示 daemon device-scoped presence 已生效。
// 下行 offer 继续携带各自 ManagedSessionID，不能要求它等于 PresenceSessionID。
message PresenceReady {
  string presence_session_id = 1;
  uint32 heartbeat_seconds = 2;
  repeated IceServer ice_servers = 3;
}

// SignalingOffer 是 Hub 中继的 WebRTC offer；它不能包含 terminal 或 capability 字段。
message SignalingOffer {
  string signaling_session_id = 1;
  string managed_session_id = 2;
  string source_device_id = 3;
  string target_device_id = 4;
  string sdp = 5;
  repeated IceCandidate candidates = 6;
  // route_preference 保留原始服务能力意图；relay_only 才表示本次 ICE 必须只使用租约绑定的 TURN。
  RoutePreference route_preference = 7;
  bool relay_only = 8;
}

// SignalingAnswer 是 daemon 返回的 WebRTC answer。
message SignalingAnswer {
  string signaling_session_id = 1;
  string sdp = 2;
  repeated IceCandidate candidates = 3;
}

// IceCandidate 是 trickle ICE 的平台无关表示。
message IceCandidate {
  string candidate = 1;
  string sdp_mid = 2;
  uint32 sdp_mline_index = 3;
  string username_fragment = 4;
}

// PresenceClosed 表示 cloud 结束当前 daemon presence，不影响本地 daemon listener。
message PresenceClosed {
  string reason = 1;
}

// PresenceEvent 是 daemon companion stream 的单条下行事件。
message PresenceEvent {
  oneof payload {
    PresenceReady ready = 1;
    SignalingOffer offer = 2;
    IceCandidate candidate = 3;
    CloudError error = 4;
    PresenceClosed closed = 5;
  }
}

// CreateSignalingSessionRequest 提交不含 capability 的 WebRTC offer。
message CreateSignalingSessionRequest {
  string endpoint_id = 1;
  string managed_session_id = 2;
  string target_device_id = 3;
  string offer_sdp = 4;
  repeated IceCandidate candidates = 5;
  RoutePreference route_preference = 6;
  // relay_only 是本次执行约束，不得从 STANDARD_RELAY 自动推断。
  bool relay_only = 7;
}

// SignalingClosed 表示 Hub 已关闭一条 signaling session。
message SignalingClosed {
  string reason = 1;
}

// SignalingEvent 是 client signaling stream 的 answer、candidate 或失败事件。
message SignalingEvent {
  oneof payload {
    SignalingAnswer answer = 1;
    IceCandidate candidate = 2;
    CloudError error = 3;
    SignalingClosed closed = 4;
  }
}

// CompleteSignalingOfferRequest 把 daemon 对单个 offer 的 answer 或稳定失败交给 companion 中继。
message CompleteSignalingOfferRequest {
  string signaling_session_id = 1;
  oneof result {
    SignalingAnswer answer = 2;
    CloudError error = 3;
  }
}

// CompleteSignalingOfferResponse 确认单个 offer 结果已由 companion 接收。
message CompleteSignalingOfferResponse {}

// AcquireRelayLeaseRequest 请求特定 managed session 的 caller-specific Relay credential。
message AcquireRelayLeaseRequest {
  string managed_session_id = 1;
  string target_device_id = 2;
  RoutePreference route_preference = 3;
  string preferred_region = 4;
}

// RelayLease 是 cloud service admission，不表达任何 terminal 权限。
message RelayLease {
  string lease_id = 1;
  bytes signed_lease = 2;
  uint64 expires_at_unix = 3;
  ObservedPath path_kind = 4;
  string route_id = 5;
  uint32 route_version = 6;
  string client_edge_relay_id = 7;
  string daemon_edge_relay_id = 8;
  uint32 max_internal_transit = 9;
  repeated IceServer ice_servers = 10;
}

// PlanManagedRouteRequest 请求同一 managed endpoint 的 direct/single-relay SmartRoute 计划。
// 候选质量、成本预算、entitlement 和内部权重属于私有服务，不由公开 caller 提交。
message PlanManagedRouteRequest {
  string endpoint_id = 1;
  string managed_session_id = 2;
  string target_device_id = 3;
  RoutePreference route_preference = 4;
}

// ManagedRoutePlan 是公开 WebRTC primitive 可以执行的最小 ICE 计划。
// 它只返回选中路径、稳定原因和短期 ICE 配置，不返回候选分数、成本或内部权重。
message ManagedRoutePlan {
  string plan_id = 1;
  string managed_session_id = 2;
  string target_device_id = 3;
  ObservedPath selected_path = 4;
  RouteSelectionReason selection_reason = 5;
  uint64 valid_until_unix = 6;
  repeated IceServer ice_servers = 7;
  bool relay_only = 8;
  string relay_region = 9;
}

// PathQualitySummary 是公开进程基于 WebRTC transport stats 形成的脱敏质量窗口。
// 成本由私有服务关联可信 usage 计算，不能由公开 caller 填写。
message PathQualitySummary {
  string managed_session_id = 1;
  ObservedPath observed_path = 2;
  uint32 rtt_p50_millis = 3;
  uint32 jitter_millis = 4;
  uint32 loss_basis_points = 5;
  uint64 throughput_bps = 6;
  uint64 connected_millis = 7;
  string network_class = 8;
  string region = 9;
  uint32 rtt_p95_millis = 10;
  uint32 sample_count = 11;
  uint32 disconnect_count = 12;
  uint64 window_started_at_unix_millis = 13;
  uint64 window_ended_at_unix_millis = 14;
  uint64 packet_count = 15;
  uint64 loss_event_count = 16;
  string carrier_tag = 17;
  string provider_tag = 18;
}

// ReportPathQualityRequest 上报一次经过脱敏和聚合的网络质量窗口。
message ReportPathQualityRequest {
  PathQualitySummary summary = 1;
}

// ReportPathQualityResponse 确认质量摘要已被 companion 接收。
message ReportPathQualityResponse {}

// ConnectionOutcome 是一次 managed connection 的最终路径与稳定错误分类。
message ConnectionOutcome {
  string managed_session_id = 1;
  ObservedPath observed_path = 2;
  CloudErrorCode error_code = 3;
  uint64 connected_millis = 4;
}

// ReportConnectionOutcomeRequest 上报不含 payload 的连接结果。
message ReportConnectionOutcomeRequest {
  ConnectionOutcome outcome = 1;
}

// ReportConnectionOutcomeResponse 确认连接结果已被 companion 接收。
message ReportConnectionOutcomeResponse {}

// IPCStreamOpened 把一次 stream operation 绑定到当前 OS connection 内的 stream id。
message IPCStreamOpened {
  uint64 stream_id = 1;
}

// IPCCloseStreamRequest 只关闭当前 OS connection 拥有的指定 stream。
message IPCCloseStreamRequest {
  uint64 stream_id = 1;
}

// IPCCancelRequest 取消当前 OS connection 内仍在执行的 unary request。
message IPCCancelRequest {
  uint64 target_request_id = 1;
}

// IPCAcknowledgement 是 close/cancel 等本地控制操作的空成功结果。
message IPCAcknowledgement {}

// IPCStreamClosed 表示 stream 正常结束；异常结束使用 IPCResponse.error。
message IPCStreamClosed {}

// IPCRequest 是桌面/headless Companion 本地 socket 或 Named Pipe 上的单条请求。
// request_id 只在当前 OS connection 内唯一；首条请求必须是 hello。
message IPCRequest {
  uint64 request_id = 1;
  oneof operation {
    CompanionHelloRequest hello = 10;
    StatusRequest status = 11;
    BeginLoginRequest begin_login = 12;
    CompleteLoginRequest complete_login = 13;
    BeginDeviceEnrollmentRequest begin_device_enrollment = 14;
    CompleteDeviceEnrollmentRequest complete_device_enrollment = 15;
    LogoutRequest logout = 16;
    DoctorRequest doctor = 17;
    ShutdownRequest shutdown = 18;
    ResolveEndpointRequest resolve_endpoint = 19;
    OpenPresenceRequest open_presence = 20;
    CreateSignalingSessionRequest create_signaling_session = 21;
    CompleteSignalingOfferRequest complete_signaling_offer = 22;
    AcquireRelayLeaseRequest acquire_relay_lease = 23;
    ReportPathQualityRequest report_path_quality = 24;
    ReportConnectionOutcomeRequest report_connection_outcome = 25;
    IPCCloseStreamRequest close_stream = 26;
    IPCCancelRequest cancel = 27;
    PlanManagedRouteRequest plan_managed_route = 28;
    BeginPresenceRequest begin_presence = 29;
    ListManagedDevicesRequest list_managed_devices = 30;
  }
}

// IPCResponse 是当前 OS connection 上 unary response 或 stream event 的统一 frame。
// request_id 对应 unary request；stream_id 对应已打开的 presence/signaling stream。
message IPCResponse {
  uint64 request_id = 1;
  uint64 stream_id = 2;
  oneof result {
    CompanionHelloResponse hello = 10;
    StatusResponse status = 11;
    LoginFlow login_flow = 12;
    CompleteLoginResponse complete_login = 13;
    DeviceEnrollmentChallenge enrollment_challenge = 14;
    CompleteDeviceEnrollmentResponse complete_enrollment = 15;
    LogoutResponse logout = 16;
    DoctorResponse doctor = 17;
    ShutdownResponse shutdown = 18;
    ResolvedEndpoint resolved_endpoint = 19;
    IPCStreamOpened stream_opened = 20;
    CompleteSignalingOfferResponse complete_signaling_offer = 21;
    RelayLease relay_lease = 22;
    ReportPathQualityResponse report_path_quality = 23;
    ReportConnectionOutcomeResponse report_connection_outcome = 24;
    PresenceEvent presence_event = 25;
    SignalingEvent signaling_event = 26;
    IPCAcknowledgement acknowledgement = 27;
    IPCStreamClosed stream_closed = 28;
    CloudError error = 29;
    ManagedRoutePlan managed_route_plan = 30;
    PresenceChallenge presence_challenge = 31;
    ListManagedDevicesResponse managed_devices = 32;
  }
}
