syntax = "proto3";

package termx.remote.auth.v1;

option go_package = "github.com/lozzow/termx/proto/remoteauthpb";

// AuthErrorCode 是端到端授权失败时允许返回给对端的稳定分类。
// detail 必须脱敏，不能暴露 grant 是否对应某个已存在 terminal。
enum AuthErrorCode {
  AUTH_ERROR_CODE_UNSPECIFIED = 0;
  AUTH_ERROR_CODE_PROTOCOL = 1;
  AUTH_ERROR_CODE_DEVICE_IDENTITY_MISMATCH = 2;
  AUTH_ERROR_CODE_CAPABILITY_INVALID = 3;
  AUTH_ERROR_CODE_CAPABILITY_EXPIRED = 4;
  AUTH_ERROR_CODE_CAPABILITY_REVOKED = 5;
  AUTH_ERROR_CODE_CAPABILITY_PROOF_INVALID = 6;
  AUTH_ERROR_CODE_SCOPE_INVALID = 7;
  AUTH_ERROR_CODE_REPLAYED = 8;
  AUTH_ERROR_CODE_INTERNAL = 9;
  AUTH_ERROR_CODE_SUBJECT_KEY_MISMATCH = 10;
  AUTH_ERROR_CODE_PAIRING_TICKET_INVALID = 11;
  AUTH_ERROR_CODE_PAIRING_TICKET_EXPIRED = 12;
  AUTH_ERROR_CODE_PAIRING_TICKET_CONSUMED = 13;
}

// ScopeKind 是 capability 成功映射到 core-v2 前的规范化 scope 分类。
enum ScopeKind {
  SCOPE_KIND_UNSPECIFIED = 0;
  SCOPE_KIND_DAEMON = 1;
  SCOPE_KIND_TERMINAL = 2;
  SCOPE_KIND_MACHINE_EVENTS = 3;
}

// ChannelBindingKind 区分实际 transport 提供的安全 channel 证明来源。
// direct TLS 与 managed WebRTC 共用同一 canonical 结构，但不能互相替换 kind 后重放 proof。
enum ChannelBindingKind {
  CHANNEL_BINDING_KIND_UNSPECIFIED = 0;
  CHANNEL_BINDING_KIND_DIRECT_TLS = 1;
  CHANNEL_BINDING_KIND_DTLS = 2;
  CHANNEL_BINDING_KIND_LOCAL_UNIX = 3;
}

// AuthOpenKind 为客户端签名输入提供明确 domain separation。
enum AuthOpenKind {
  AUTH_OPEN_KIND_UNSPECIFIED = 0;
  AUTH_OPEN_KIND_CAPABILITY = 1;
  AUTH_OPEN_KIND_PAIRING = 2;
}

// ChannelBinding 是 transport adapter 从实际 TLS/DTLS/local Unix channel 取得的 SHA-256 binding。
// binding_hash 固定为 32 bytes；SDP、route 地址或 Cloud signaling 字段不能替代该值。
message ChannelBinding {
  ChannelBindingKind kind = 1;
  bytes binding_hash = 2;
}

// AuthEnvelope 是 DataChannel protocol 切换前唯一允许出现的 versioned frame。
// 每条 DataChannel 使用独立 auth_session_id；CapabilityAccepted 后该 envelope 不得再次出现。
message AuthEnvelope {
  string protocol = 1;
  uint32 version = 2;
  string auth_session_id = 3;
  oneof payload {
    DeviceHello device_hello = 4;
    CapabilityOpen capability_open = 5;
    CapabilityAccepted capability_accepted = 6;
    CapabilityRejected capability_rejected = 7;
    PairingOpen pairing_open = 8;
    PairingAccepted pairing_accepted = 9;
  }
}

// DeviceHello 是 daemon 对长期 DeviceIdentity 和本次实际 transport channel 的联合证明。
message DeviceHello {
  string device_id = 1;
  bytes device_public_key = 2;
  string device_fingerprint = 3;
  bytes server_nonce = 4;
  ChannelBinding channel_binding = 5;
  int64 issued_at_unix_nano = 6;
  bytes signature = 7;
}

// CapabilityOpen 证明 client 持有 grant 对应 ClientAccessIdentity private key，并把 proof 绑定当前 channel。
// grant 只允许出现在端到端 direct TLS 或 DTLS DataChannel 内，不能进入 cloud signaling DTO。
message CapabilityOpen {
  string grant = 1;
  bytes client_public_key = 2;
  bytes client_nonce = 3;
  bytes proof = 4;
}

// PairingOpen 只能兑换一次性 PairingTicket，不能访问 terminal、history、file 或普通 protocol method。
// client_public_key/proof 先证明目标 ClientAccessIdentity possession，daemon 才允许原子消费 ticket。
message PairingOpen {
  bytes pairing_bundle = 1;
  bytes client_public_key = 2;
  string client_label = 3;
  bytes client_nonce = 4;
  bytes proof = 5;
}

// ScopeSummary 是 daemon 已接受 capability 的最小无歧义投影。
message ScopeSummary {
  ScopeKind kind = 1;
  string terminal_id = 2;
  bool manage_client_access = 3;
}

// ClientAccessScope 是 remote.access 管理 RPC 使用的完整 typed scope。
// 它与 signed CapabilityGrant scope 一一对应，不通过 Struct 或字符串字段表复制 schema。
message ClientAccessScope {
  bool allow_daemon = 1;
  string terminal_id = 2;
  bool machine_events_only = 3;
  bool file_read_metadata = 4;
  bool file_read_content = 5;
  bool file_write_content = 6;
  bool file_mutate = 7;
  bool manage_client_access = 8;
}

message ClientAccessIdentityResult {
  string device_id = 1;
  string device_fingerprint = 2;
  bytes device_public_key = 3;
}

message ClientAccessTicketCreateRequest {
  string label = 1;
  ClientAccessScope scope = 2;
  int64 ticket_ttl_seconds = 3;
  int64 grant_lifetime_seconds = 4;
}

message ClientAccessTicketCreateResult {
  bytes bundle = 1;
  string ticket_id = 2;
  int64 expires_at_unix_nano = 3;
}

message ClientAccessRevokeRequest {
  string grant_id = 1;
}

message ClientAccessRecord {
  string grant_id = 1;
  string revocation_id = 2;
  string subject_key_fingerprint = 3;
  string client_label = 4;
  ClientAccessScope scope = 5;
  int64 issued_at_unix_nano = 6;
  int64 expires_at_unix_nano = 7;
  int64 revoked_at_unix_nano = 8;
}

message ClientAccessListResult {
  repeated ClientAccessRecord records = 1;
}

// CapabilityAccepted 是 remote auth 到 termx protocol 的单向切换点。
message CapabilityAccepted {
  string grant_id = 1;
  ScopeSummary scope = 2;
  string subject_key_fingerprint = 3;
}

// PairingAccepted 返回本次原子事务已持久化的 client-bound grant 和稳定 delivery receipt。
// 响应丢失后，相同 ticket 与相同 client key 可以取回完全相同的 grant/receipt；其他 key 必须 fail closed。
message PairingAccepted {
  string grant = 1;
  string delivery_receipt = 2;
  string subject_key_fingerprint = 3;
  ScopeSummary scope = 4;
}

// CapabilityRejected 返回稳定错误类别和固定脱敏消息，随后 channel 必须关闭。
message CapabilityRejected {
  AuthErrorCode code = 1;
  string message = 2;
}

// DeviceHelloSignatureInput 是 Ed25519 签名的跨平台 canonical protobuf。
// 所有实现必须拒绝 unknown field，并使用 deterministic protobuf bytes，不得改用 JSON 或字段拼接。
message DeviceHelloSignatureInput {
  string protocol = 1;
  uint32 version = 2;
  string auth_session_id = 3;
  string device_id = 4;
  bytes device_public_key = 5;
  string device_fingerprint = 6;
  bytes server_nonce = 7;
  ChannelBinding channel_binding = 8;
  int64 issued_at_unix_nano = 9;
}

// ClientProofInput 是 ClientAccessIdentity Ed25519 签名的跨平台 canonical protobuf。
// credential_sha256 对 capability 使用原始 grant UTF-8 bytes、对 pairing 使用完整 canonical bootstrap protobuf bytes；open_kind 防止跨状态机重放。
message ClientProofInput {
  string protocol = 1;
  uint32 version = 2;
  string auth_session_id = 3;
  bytes server_nonce = 4;
  bytes client_nonce = 5;
  ChannelBinding channel_binding = 6;
  bytes credential_sha256 = 7;
  bytes client_public_key = 8;
  AuthOpenKind open_kind = 9;
}

// EndpointRouteKind 是跨 Go/Kotlin/TypeScript wire contract 的 route 分类。
// Endpoint/Route 的领域 owner 仍是客户端 connection runtime；该枚举不能被解释为一次运行时 transport 或 managed path。
enum EndpointRouteKind {
  ENDPOINT_ROUTE_KIND_UNSPECIFIED = 0;
  ENDPOINT_ROUTE_KIND_LOCAL_UNIX = 1;
  ENDPOINT_ROUTE_KIND_SSH_STDIO = 2;
  ENDPOINT_ROUTE_KIND_DIRECT_TLS = 3;
  ENDPOINT_ROUTE_KIND_MANAGED_WEBRTC = 4;
}

// EndpointConnectMode 描述客户端何时可以自动建立 Endpoint session。
enum EndpointConnectMode {
  ENDPOINT_CONNECT_MODE_UNSPECIFIED = 0;
  ENDPOINT_CONNECT_MODE_AUTO = 1;
  ENDPOINT_CONNECT_MODE_ON_DEMAND = 2;
  ENDPOINT_CONNECT_MODE_MANUAL = 3;
}

// EndpointRelayMode 只描述 managed-webrtc route 内部允许的 direct/single Relay 策略。
enum EndpointRelayMode {
  ENDPOINT_RELAY_MODE_UNSPECIFIED = 0;
  ENDPOINT_RELAY_MODE_AUTO = 1;
  ENDPOINT_RELAY_MODE_DIRECT = 2;
  ENDPOINT_RELAY_MODE_RELAY_ONLY = 3;
  ENDPOINT_RELAY_MODE_SMART_ROUTE = 4;
}

// EndpointSource 记录 route 或用户策略的来源，供确定性 assembler 保留更高权重的已确认信息。
enum EndpointSource {
  ENDPOINT_SOURCE_UNSPECIFIED = 0;
  ENDPOINT_SOURCE_LAN = 1;
  ENDPOINT_SOURCE_CLOUD = 2;
  ENDPOINT_SOURCE_BOOTSTRAP = 3;
  ENDPOINT_SOURCE_LOCAL = 4;
  ENDPOINT_SOURCE_MANUAL = 5;
  ENDPOINT_SOURCE_SHARE = 6;
  ENDPOINT_SOURCE_USER = 7;
}

// EndpointCredentialKind 只描述目标平台 secure store 中凭据的类别；wire contract 永远不携带凭据 body。
enum EndpointCredentialKind {
  ENDPOINT_CREDENTIAL_KIND_UNSPECIFIED = 0;
  ENDPOINT_CREDENTIAL_KIND_SSH_AGENT = 1;
  ENDPOINT_CREDENTIAL_KIND_SSH_PRIVATE_KEY = 2;
  ENDPOINT_CREDENTIAL_KIND_SSH_PASSWORD = 3;
  ENDPOINT_CREDENTIAL_KIND_CAPABILITY_GRANT = 4;
  ENDPOINT_CREDENTIAL_KIND_CLOUD_PROFILE = 5;
}

// EndpointDaemonIdentity 是跨来源安全归并 daemon 的唯一锚点。
// device_public_key 只在 daemon-signed bootstrap 中必填；普通 registry 至少保存 DeviceID 与 fingerprint pin。
message EndpointDaemonIdentity {
  string device_id = 1;
  bytes device_public_key = 2;
  string device_fingerprint = 3;
}

// EndpointSelectionPolicy 是客户端本地竞速策略；未配置 route priority 时仍表示 full race。
message EndpointSelectionPolicy {
  bool hedge_delay_configured = 1;
  uint64 hedge_delay_millis = 2;
}

// EndpointAccessRoute 是跨平台持久 route schema。
// kind-specific 字段必须由 strict parser 互斥校验；credential_ref 仅在当前平台本地 store 中有意义。
message EndpointAccessRoute {
  string route_id = 1;
  EndpointRouteKind kind = 2;
  bool enabled = 3;
  bool manual_only = 4;
  optional int32 priority = 5;
  string credential_ref = 6;
  EndpointSource source = 7;
  EndpointSource policy_source = 8;
  string socket = 9;
  string host = 10;
  uint32 port = 11;
  string user = 12;
  string proxy_jump = 13;
  string remote_socket = 14;
  repeated string host_key_fingerprints = 15;
  repeated string addresses = 16;
  string server_name = 17;
  string target_device_id = 18;
  string account_profile = 19;
  EndpointRelayMode relay_mode = 20;
}

// EndpointCredentialDescriptor 描述 share 后目标端需要解析或重新创建的凭据，不携带源平台 credential ref 或 secret body。
message EndpointCredentialDescriptor {
  string descriptor_id = 1;
  EndpointCredentialKind kind = 2;
  bool exportable = 3;
}

// PairingTicketDescriptor 是 daemon-local 一次性授权兑换票据的公开部分。
message PairingTicketDescriptor {
  string ticket_id = 1;
  repeated string scope_ceiling = 2;
  int64 expires_at_unix_nano = 3;
  bytes nonce = 4;
  uint32 max_redemptions = 5;
  bytes signature = 6;
  int64 issued_at_unix_nano = 7;
  int64 grant_lifetime_seconds = 8;
}

// EndpointAuthorizationBootstrap 只允许携带短期 PairingTicket，或双向离线扫码中已绑定接收方 key 的 grant。
message EndpointAuthorizationBootstrap {
  oneof payload {
    PairingTicketDescriptor pairing_ticket = 1;
    bytes bound_grant = 2;
  }
}

// EndpointBootstrapBundleV2 是 daemon DeviceIdentity 签名的增量 bootstrap wire contract。
// 它不包含客户端 priority、local-unix、Cloud token、Hub/Relay 地址、SSH credential body 或本地 credential ref。
message EndpointBootstrapBundleV2 {
  uint32 schema_version = 1;
  string bundle_id = 2;
  EndpointDaemonIdentity identity = 3;
  string suggested_label = 4;
  repeated EndpointAccessRoute routes = 5;
  EndpointAuthorizationBootstrap authorization = 6;
  int64 issued_at_unix_nano = 7;
  int64 expires_at_unix_nano = 8;
  bytes bundle_signature = 9;
}

// PairingTicketSignatureInput 是 DeviceIdentity 对一次性 ticket 签名的唯一 canonical protobuf。
// ticket.signature 必须在构造本消息前清空；issuer 字段必须与外层 bootstrap identity 完全一致。
message PairingTicketSignatureInput {
  string protocol = 1;
  uint32 version = 2;
  string issuer_device_id = 3;
  string issuer_device_fingerprint = 4;
  PairingTicketDescriptor ticket = 5;
}

// EndpointBootstrapSignatureInput 是 DeviceIdentity 对完整 bootstrap 签名的唯一 canonical protobuf。
// bundle.bundle_signature 必须在构造本消息前清空；内部 PairingTicket signature 保持在签名覆盖范围内。
message EndpointBootstrapSignatureInput {
  string protocol = 1;
  uint32 version = 2;
  EndpointBootstrapBundleV2 bundle = 3;
}

// ClientEndpointShareBundleV1 是用户确认后通过实时 TLS share session 发送的客户端配置迁移 contract。
// source EndpointID、runtime、源 credential ref、Cloud token 和源 CapabilityGrant 永远不得进入该消息。
message ClientEndpointShareBundleV1 {
  uint32 schema_version = 1;
  string transfer_id = 2;
  EndpointDaemonIdentity identity = 3;
  string suggested_label = 4;
  repeated EndpointAccessRoute routes = 5;
  EndpointConnectMode connect_mode = 6;
  EndpointSelectionPolicy selection_policy = 7;
  repeated EndpointCredentialDescriptor credential_descriptors = 8;
  // bound_grant 预留给 CONN002 生成并验证的目标 ClientAccessIdentity-bound grant；不得放入源客户端 bearer grant。
  bytes bound_grant = 9;
  int64 issued_at_unix_nano = 10;
  int64 expires_at_unix_nano = 11;
}

// ShareSessionOffer 是静态二维码允许包含的全部内容。
// endpoint 配置、credential、CapabilityGrant 和 Cloud material 只能在用户确认后的实时 TLS channel 内传输。
message ShareSessionOffer {
  uint32 schema_version = 1;
  string transfer_id = 2;
  repeated string listener_addresses = 3;
  string ephemeral_certificate_sha256 = 4;
  bytes one_time_session_secret = 5;
  int64 expires_at_unix_nano = 6;
}
