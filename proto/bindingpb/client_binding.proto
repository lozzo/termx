syntax = "proto3";

package muxvia.client.binding.v1;

import "apipb/application.proto";
import "apipb/common.proto";
import "cloudpb/cloud_companion.proto";
import "cloudpb/cloud_topology.proto";
import "remoteauthpb/remote_auth.proto";

option go_package = "github.com/muxvia/muxvia/proto/bindingpb";

enum ConnectIntent {
  CONNECT_INTENT_UNSPECIFIED = 0;
  CONNECT_INTENT_INTERACTIVE = 1;
  CONNECT_INTENT_BACKGROUND = 2;
  CONNECT_INTENT_PROBE = 3;
}

enum ResourceStreamFrameType {
  RESOURCE_STREAM_FRAME_TYPE_UNSPECIFIED = 0;
  RESOURCE_STREAM_FRAME_TYPE_FILE_DATA = 1;
  RESOURCE_STREAM_FRAME_TYPE_FILE_ACK = 2;
  RESOURCE_STREAM_FRAME_TYPE_FILE_FINISH = 3;
  RESOURCE_STREAM_FRAME_TYPE_FILE_RESULT = 4;
  RESOURCE_STREAM_FRAME_TYPE_ERROR = 5;
  RESOURCE_STREAM_FRAME_TYPE_FILE_FINISH_AUTO = 6;
}

message OpenSessionRequest {
  string request_id = 1;
  string endpoint_id = 2;
  string route_override = 3;
  ConnectIntent intent = 4;
  reserved 5;
}

message ImportPairingRequest {
  string request_id = 1;
  string portable_payload = 2;
  string expected_endpoint_id = 3;
}

message ImportPairingResult {
  string request_id = 1;
  uint64 operation_handle = 2;
  muxvia.remote.auth.v1.EndpointConfigV1 endpoint = 3;
  string ticket_id = 4;
  string client_key_fingerprint = 5;
  int64 expires_at_unix_nano = 6;
  bool authorization_required = 7;
  muxvia.api.v1.ApiError error = 8;
  muxvia.remote.auth.v1.EndpointRegistryV1 registry = 9;
}

message DeleteCredentialRequest {
  string request_id = 1;
  string credential_ref = 2;
}

message DeleteCredentialResult {
  string request_id = 1;
  uint64 operation_handle = 2;
  muxvia.api.v1.ApiError error = 3;
}

message EndpointRegistryGetRequest { string request_id = 1; }

message EndpointRegistryGetResult {
  string request_id = 1;
  uint64 operation_handle = 2;
  muxvia.remote.auth.v1.EndpointRegistryV1 registry = 3;
  muxvia.api.v1.ApiError error = 4;
}

message EndpointUpsertRequest {
  string request_id = 1;
  muxvia.remote.auth.v1.EndpointConfigV1 endpoint = 2;
  bool make_default = 3;
}

message EndpointUpsertResult {
  string request_id = 1;
  uint64 operation_handle = 2;
  muxvia.remote.auth.v1.EndpointConfigV1 endpoint = 3;
  muxvia.remote.auth.v1.EndpointRegistryV1 registry = 4;
  muxvia.api.v1.ApiError error = 5;
}

message EndpointDeleteRequest {
  string request_id = 1;
  string endpoint_id = 2;
}

message EndpointDeleteResult {
  string request_id = 1;
  uint64 operation_handle = 2;
  string endpoint_id = 3;
  muxvia.remote.auth.v1.EndpointRegistryV1 registry = 4;
  muxvia.api.v1.ApiError error = 5;
}

// EndpointShareReceiveRequest 通过 Go Client Engine 接收一次性 TLS share bundle，只生成待确认预览。
message EndpointShareReceiveRequest {
  string request_id = 1;
  string portable_offer = 2;
}

message EndpointShareRouteDiff {
  string route_id = 1;
  string route_kind = 2;
  string action = 3;
}

// EndpointSharePreview 是 Go 根据当前 registry 与已验证 share bundle 计算的确认信息。
message EndpointSharePreview {
  string import_token = 1;
  string endpoint_id = 2;
  string label = 3;
  muxvia.remote.auth.v1.EndpointDaemonIdentity identity = 4;
  repeated EndpointShareRouteDiff route_diffs = 5;
  bool connect_mode_changed = 6;
  bool selection_policy_changed = 7;
  repeated muxvia.remote.auth.v1.EndpointCredentialDescriptor credential_descriptors = 8;
  int64 expires_at_unix_nano = 9;
}

message EndpointShareReceiveResult {
  string request_id = 1;
  uint64 operation_handle = 2;
  EndpointSharePreview preview = 3;
  muxvia.api.v1.ApiError error = 4;
}

// EndpointShareCommitRequest 仅提交当前 generation 内尚未过期的 preview token。
message EndpointShareCommitRequest {
  string request_id = 1;
  string import_token = 2;
}

message EndpointShareCommitResult {
  string request_id = 1;
  uint64 operation_handle = 2;
  muxvia.remote.auth.v1.EndpointConfigV1 endpoint = 3;
  muxvia.remote.auth.v1.EndpointRegistryV1 registry = 4;
  bool authorization_required = 5;
  muxvia.api.v1.ApiError error = 6;
}

// SSHCredentialProvisionRequest 让 Go Client Engine 为已存在的 SSH Route 准备目标平台 signer。
// endpoint_id/route_id 只定位 Go registry 中的 Route；平台不会收到或解析 Endpoint 配置。
message SSHCredentialProvisionRequest {
  string request_id = 1;
  string endpoint_id = 2;
  string route_id = 3;
}

// SSHCredentialProvisionResult 返回更新后的 Go registry projection 和可安装到 SSH server 的公钥。
// private key 始终留在平台 secure signer 中，不进入 Proto payload。
message SSHCredentialProvisionResult {
  string request_id = 1;
  uint64 operation_handle = 2;
  muxvia.remote.auth.v1.EndpointConfigV1 endpoint = 3;
  muxvia.remote.auth.v1.EndpointRegistryV1 registry = 4;
  string credential_ref = 5;
  string authorized_key = 6;
  string key_fingerprint = 7;
  muxvia.api.v1.ApiError error = 8;
}

message EngineCommand {
  oneof command {
    ImportPairingRequest import_pairing = 1;
    DeleteCredentialRequest delete_credential = 2;
    EndpointRegistryGetRequest endpoint_registry_get = 3;
    EndpointUpsertRequest endpoint_upsert = 4;
    EndpointDeleteRequest endpoint_delete = 5;
    EndpointShareReceiveRequest endpoint_share_receive = 6;
    EndpointShareCommitRequest endpoint_share_commit = 7;
    SSHCredentialProvisionRequest ssh_credential_provision = 8;
  }
}

message OpenSessionResult {
  string request_id = 1;
  uint64 operation_handle = 2;
  uint64 session_handle = 3;
  muxvia.api.v1.EndpointSessionStamp session = 4;
  muxvia.api.v1.ApiError error = 5;
}

message ExecuteResult {
  uint64 operation_handle = 1;
  uint64 session_handle = 2;
  muxvia.api.v1.ResultEnvelope result = 3;
  muxvia.api.v1.ApiError error = 4;
}

message ApplicationEvent {
  uint64 session_handle = 1;
  muxvia.api.v1.EventEnvelope event = 2;
}

message OpenResourceStreamRequest {
  muxvia.api.v1.ResourceHandle resource = 1;
  int64 initial_upload_offset = 2;
}

message ResourceStreamFrame {
  uint64 stream_handle = 1;
  ResourceStreamFrameType type = 2;
  bytes payload = 3;
}

message ResourceStreamClosedEvent {
  uint64 stream_handle = 1;
  muxvia.api.v1.ApiError error = 2;
}

message SessionClosedEvent {
  uint64 session_handle = 1;
  muxvia.api.v1.EndpointSessionStamp session = 2;
  muxvia.api.v1.ApiError error = 3;
}

message EventEnvelope {
  uint32 abi_version = 1;
  uint64 sequence = 2;
  oneof event {
    OpenSessionResult open_session = 10;
    ExecuteResult execute = 11;
    ApplicationEvent application = 12;
    SessionClosedEvent session_closed = 13;
    ImportPairingResult import_pairing = 14;
    DeleteCredentialResult delete_credential = 15;
    ResourceStreamFrame resource_stream_frame = 16;
    ResourceStreamClosedEvent resource_stream_closed = 17;
    EndpointRegistryGetResult endpoint_registry_get = 18;
    EndpointUpsertResult endpoint_upsert = 19;
    EndpointDeleteResult endpoint_delete = 20;
    EndpointShareReceiveResult endpoint_share_receive = 21;
    EndpointShareCommitResult endpoint_share_commit = 22;
    SSHCredentialProvisionResult ssh_credential_provision = 23;
  }
}

message CredentialResolveRequest {
  string endpoint_id = 1;
  string credential_ref = 2;
}

message CredentialPrepareRequest {
  string endpoint_id = 1;
  string credential_ref = 2;
}

message CredentialDeleteRequest { string credential_ref = 1; }

message CredentialBindRequest {
  string endpoint_id = 1;
  string credential_ref = 2;
  string capability_grant = 3;
}

message CredentialRecord {
  string endpoint_id = 1;
  string credential_ref = 2;
  bytes public_key = 3;
  string key_fingerprint = 4;
  string capability_grant = 5;
  bool newly_created = 6;
}

message CredentialSignRequest {
  string credential_ref = 1;
  bytes payload = 2;
}

message CredentialSignResponse { bytes signature = 1; }

// SSHCredentialLookupRequest 查询或显式创建一个平台不可导出的 SSH signer。
// create_if_missing=false 只能查询，planner 不得因为能力探测而创建新 key。
message SSHCredentialLookupRequest {
  string credential_ref = 1;
  bool create_if_missing = 2;
}

message SSHCredentialDeleteRequest { string credential_ref = 1; }

// SSHCredentialRecord 只返回 PKIX 公钥；private key handle 和 key body 不跨平台边界。
message SSHCredentialRecord {
  string credential_ref = 1;
  bytes public_key_pkix = 2;
  bool newly_created = 3;
}

// SSHCredentialSignRequest 让平台 signer 对 Go SSH 实现已计算的 digest 签名。
// 当前 Android contract 只允许 ECDSA P-256 + SHA-256。
message SSHCredentialSignRequest {
  string credential_ref = 1;
  bytes digest = 2;
  string hash = 3;
}

message SSHCredentialSignResponse { bytes signature = 1; }

// EndpointRegistryLoad/Store 是平台 opaque blob primitive；平台不得解析 registry 字段或建立第二份索引。
message EndpointRegistryLoadRequest {}
message EndpointRegistryStoreRequest {
  bytes registry_proto = 1;
  repeated string delete_credential_refs = 2;
}
message EndpointRegistryLoaded { bytes registry_proto = 1; }

message SignalingEvents { repeated muxvia.cloud.v1.SignalingEvent events = 1; }

// CloudRouteEligibilityRequest 只查询当前平台账号 session 是否允许 Go planner 尝试 managed Route。
// Relay 的最终订阅和配额准入仍由 Control Plane 在签发 RelayLease 时判断。
message CloudRouteEligibilityRequest {
  string account_profile_ref = 1;
  muxvia.remote.auth.v1.ManagedWebRTCRelayMode relay_mode = 2;
}

message CloudRouteEligibility {
  bool account_session_available = 1;
  bool managed_direct_available = 2;
  bool relay_available = 3;
}

// WebRTCOpenPeerRequest 只描述浏览器创建 RTCPeerConnection 所需的平台 primitive。
// route/auth/session 真值仍由 Go managed engine 持有。
message WebRTCOpenPeerRequest {
  repeated muxvia.cloud.v1.IceServer ice_servers = 1;
  muxvia.cloud.v1.RoutePreference route_preference = 2;
  bool relay_only = 3;
}

message WebRTCPeerOpened {
  uint64 peer_handle = 1;
  uint64 channel_handle = 2;
}

message WebRTCPeerRequest { uint64 peer_handle = 1; }

message WebRTCCreateOfferResult { string offer_sdp = 1; }

message WebRTCApplyAnswerRequest {
  uint64 peer_handle = 1;
  string answer_sdp = 2;
  repeated muxvia.cloud.v1.IceCandidate candidates = 3;
}

message WebRTCPeerReady {
  string remote_certificate_fingerprint = 1;
  muxvia.cloud.v1.ObservedPath observed_path = 2;
}

message WebRTCChannelSendRequest {
  uint64 channel_handle = 1;
  bytes payload = 2;
}

message WebRTCChannelSendResult { uint64 buffered_amount = 1; }

message WebRTCChannelThresholdRequest {
  uint64 channel_handle = 1;
  uint64 low_threshold = 2;
}

message WebRTCPeerSnapshotRequest {
  uint64 peer_handle = 1;
  int64 sampled_at_unix_nano = 2;
}

message WebRTCPeerSnapshot {
  bool valid = 1;
  string pair_id = 2;
  muxvia.cloud.v1.ObservedPath path = 3;
  string network_class = 4;
  int64 sampled_at_unix_nano = 5;
  int64 round_trip_nanos = 6;
  uint64 bytes_sent = 7;
  uint64 bytes_received = 8;
  uint64 packets_sent = 9;
  uint64 loss_events = 10;
  bool connected = 11;
}

message WebRTCCloseRequest { uint64 handle = 1; }

message WebRTCChannelMessageEvent {
  uint64 channel_handle = 1;
  bytes payload = 2;
}

message WebRTCChannelClosedEvent { uint64 channel_handle = 1; }

message WebRTCBufferedAmountLowEvent {
  uint64 channel_handle = 1;
  uint64 buffered_amount = 2;
}

// PlatformEvent 是浏览器异步 primitive 回到 Go engine 的唯一入口。
// engine handle 在 WASM export 层完成 generation fence，事件本身不携带业务 session。
message PlatformEvent {
  oneof event {
    WebRTCChannelMessageEvent webrtc_channel_message = 10;
    WebRTCChannelClosedEvent webrtc_channel_closed = 11;
    WebRTCBufferedAmountLowEvent webrtc_buffered_amount_low = 12;
  }
}

message PlatformRequest {
  uint64 request_id = 1;
  oneof request {
    CredentialResolveRequest credential_resolve = 10;
    CredentialPrepareRequest credential_prepare = 11;
    CredentialDeleteRequest credential_delete = 12;
    CredentialSignRequest credential_sign = 13;
    CredentialBindRequest credential_bind = 14;
    EndpointRegistryLoadRequest endpoint_registry_load = 15;
    EndpointRegistryStoreRequest endpoint_registry_store = 16;
    SSHCredentialLookupRequest ssh_credential_lookup = 17;
    SSHCredentialSignRequest ssh_credential_sign = 18;
    SSHCredentialDeleteRequest ssh_credential_delete = 19;
    muxvia.cloud.v1.ResolveEndpointRequest cloud_resolve_endpoint = 20;
    muxvia.cloud.v1.CreateSignalingSessionRequest cloud_create_signaling = 21;
    muxvia.cloud.v1.AcquireRelayLeaseRequest cloud_acquire_relay = 22;
    muxvia.cloud.v1.PlanManagedRouteRequest cloud_plan_route = 23;
    muxvia.cloud.v1.ReportPathQualityRequest cloud_report_quality = 24;
    muxvia.cloud.v1.ReportConnectionOutcomeRequest cloud_report_outcome = 25;
    CloudRouteEligibilityRequest cloud_route_eligibility = 26;
    WebRTCOpenPeerRequest webrtc_open_peer = 30;
    WebRTCPeerRequest webrtc_create_offer = 31;
    WebRTCApplyAnswerRequest webrtc_apply_answer = 32;
    WebRTCPeerRequest webrtc_wait_ready = 33;
    WebRTCChannelSendRequest webrtc_channel_send = 34;
    WebRTCChannelThresholdRequest webrtc_channel_threshold = 35;
    WebRTCPeerSnapshotRequest webrtc_peer_snapshot = 36;
    WebRTCCloseRequest webrtc_close_peer = 37;
    WebRTCCloseRequest webrtc_close_channel = 38;
  }
}

message PlatformResponse {
  uint64 request_id = 1;
  muxvia.api.v1.ApiError error = 2;
  oneof response {
    CredentialRecord credential = 10;
    CredentialSignResponse credential_sign = 11;
    EndpointRegistryLoaded endpoint_registry = 12;
    SSHCredentialRecord ssh_credential = 13;
    SSHCredentialSignResponse ssh_credential_sign = 14;
    muxvia.cloud.v1.ResolvedEndpoint cloud_resolved_endpoint = 20;
    SignalingEvents cloud_signaling = 21;
    muxvia.cloud.v1.RelayLease cloud_relay_lease = 22;
    muxvia.cloud.v1.ManagedRoutePlan cloud_route_plan = 23;
    muxvia.cloud.v1.ReportPathQualityResponse cloud_quality_reported = 24;
    muxvia.cloud.v1.ReportConnectionOutcomeResponse cloud_outcome_reported = 25;
    CloudRouteEligibility cloud_route_eligibility = 26;
    WebRTCPeerOpened webrtc_peer_opened = 30;
    WebRTCCreateOfferResult webrtc_offer = 31;
    WebRTCPeerReady webrtc_peer_ready = 32;
    WebRTCChannelSendResult webrtc_channel_sent = 33;
    WebRTCPeerSnapshot webrtc_peer_snapshot = 34;
  }
}
