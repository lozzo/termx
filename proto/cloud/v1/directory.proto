syntax = "proto3";

package muxvia.cloud.v1;

import "cloud/v1/common.proto";
import "cloud/v1/enrollment.proto";

option go_package = "github.com/muxvia/muxvia/proto/cloud/v1;cloudv1";

// BeginClientRouteRequest 只提交 DeviceIdentity 签名的发现 grant；Controller 不接收 terminal capability。
message BeginClientRouteRequest {
  SignedEnvelope cloud_route_grant = 1;
}

message ResolveClientRouteRequest {
  string challenge_id = 1;
  string request_id = 2;
  bytes client_proof = 3;
}

message ResolveClientRouteResponse {
  SignedEnvelope client_ticket = 1;
  CandidateEdge edge = 2;
}

// DirectoryService 是客户端解析实时 daemon Presence 和获取短期 ClientTicket 的唯一公共 API。
service DirectoryService {
  rpc BeginClientRoute(BeginClientRouteRequest) returns (IdentityChallenge);
  rpc ResolveClientRoute(ResolveClientRouteRequest) returns (ResolveClientRouteResponse);
}
