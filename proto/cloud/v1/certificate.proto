syntax = "proto3";

package muxvia.cloud.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/muxvia/muxvia/proto/cloud/v1;cloudv1";

// CertificateIssuanceMode 描述证书私钥的唯一 owner。R8 只允许 Edge 本机 CSR。
enum CertificateIssuanceMode {
  CERTIFICATE_ISSUANCE_MODE_UNSPECIFIED = 0;
  CERTIFICATE_ISSUANCE_MODE_EDGE_CSR = 1;
}

enum CertificateProfileState {
  CERTIFICATE_PROFILE_STATE_UNSPECIFIED = 0;
  CERTIFICATE_PROFILE_STATE_ACTIVE = 1;
  CERTIFICATE_PROFILE_STATE_ARCHIVED = 2;
}

// EdgeCertificateState 是持久 desired/applied 发布状态，不表示 Edge 在线。
enum EdgeCertificateState {
  EDGE_CERTIFICATE_STATE_UNSPECIFIED = 0;
  EDGE_CERTIFICATE_STATE_BOUND = 1;
  EDGE_CERTIFICATE_STATE_PENDING_CSR = 2;
  EDGE_CERTIFICATE_STATE_STAGED = 3;
  EDGE_CERTIFICATE_STATE_APPLIED = 4;
  EDGE_CERTIFICATE_STATE_FAILED = 5;
}

message CertificateProfile {
  string profile_id = 1;
  string name = 2;
  repeated string domains = 3;
  CertificateIssuanceMode issuance_mode = 4;
  CertificateProfileState state = 5;
  uint64 latest_version = 6;
  uint64 revision = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// CertificateVersion 是一个档案版本在具体 Edge CSR 上签发的公开证书元数据。
// certificate_chain_pem 是公开材料；任何私钥都禁止进入本消息。
message CertificateVersion {
  string profile_id = 1;
  uint64 version = 2;
  string edge_id = 3;
  bytes certificate_chain_pem = 4;
  bytes fingerprint_sha256 = 5;
  google.protobuf.Timestamp not_before = 6;
  google.protobuf.Timestamp not_after = 7;
  google.protobuf.Timestamp created_at = 8;
}

message EdgeCertificateBinding {
  string edge_id = 1;
  string profile_id = 2;
  uint64 desired_version = 3;
  uint64 applied_version = 4;
  EdgeCertificateState state = 5;
  string last_error_code = 6;
  uint64 revision = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message ManagedCertificateProfile {
  CertificateProfile profile = 1;
  repeated CertificateVersion versions = 2;
  repeated EdgeCertificateBinding bindings = 3;
}

message ListCertificateProfilesRequest {}
message ListCertificateProfilesResponse {
  repeated ManagedCertificateProfile profiles = 1;
}

message CreateCertificateProfileRequest {
  string name = 1;
  repeated string domains = 2;
}
message CreateCertificateProfileResponse {
  ManagedCertificateProfile profile = 1;
}

message BindCertificateProfileRequest {
  string profile_id = 1;
  string edge_id = 2;
  uint64 expected_profile_revision = 3;
  string reason = 4;
}
message BindCertificateProfileResponse {
  EdgeCertificateBinding binding = 1;
}

message IssueCertificateVersionRequest {
  string profile_id = 1;
  uint64 expected_profile_revision = 2;
  string reason = 3;
}
message IssueCertificateVersionResponse {
  ManagedCertificateProfile profile = 1;
}

message PublishCertificateVersionRequest {
  string profile_id = 1;
  uint64 version = 2;
  repeated string edge_ids = 3;
  string reason = 4;
}
message PublishCertificateVersionResponse {
  ManagedCertificateProfile profile = 1;
}

message RollbackCertificateVersionRequest {
  string profile_id = 1;
  uint64 version = 2;
  repeated string edge_ids = 3;
  string reason = 4;
}
message RollbackCertificateVersionResponse {
  ManagedCertificateProfile profile = 1;
}

// CertificateCSRRequest 由 Controller 通过当前 Edge generation 请求本机生成 CSR。
message CertificateCSRRequest {
  string operation_id = 1;
  string profile_id = 2;
  uint64 version = 3;
  repeated string domains = 4;
}

message CertificateCSRResult {
  string operation_id = 1;
  string profile_id = 2;
  uint64 version = 3;
  bytes csr_pem = 4;
  string error_code = 5;
}

message CertificateRelease {
  string operation_id = 1;
  string edge_id = 2;
  string profile_id = 3;
  uint64 version = 4;
  repeated string domains = 5;
  bytes certificate_chain_pem = 6;
  bytes fingerprint_sha256 = 7;
  google.protobuf.Timestamp not_before = 8;
  google.protobuf.Timestamp not_after = 9;
}

// SignedCertificateRelease 使用证书发布专用签名域，不能复用 DesiredConfig 或 artifact 签名。
message SignedCertificateRelease {
  string key_id = 1;
  bytes payload = 2;
  bytes signature = 3;
}

message CertificateApplied {
  string operation_id = 1;
  string profile_id = 2;
  uint64 version = 3;
  bool applied = 4;
  string error_code = 5;
  bytes fingerprint_sha256 = 6;
  google.protobuf.Timestamp completed_at = 7;
}
