syntax = "proto3";

package muxvia.cloud.v1;

import "google/protobuf/timestamp.proto";
import "cloud/v1/usage.proto";

option go_package = "github.com/muxvia/muxvia/proto/cloud/v1;cloudv1";

// ClientProduct 表示建立 Cloud 信令连接的官方客户端形态。
enum ClientProduct {
  CLIENT_PRODUCT_UNSPECIFIED = 0;
  CLIENT_PRODUCT_TUI = 1;
  CLIENT_PRODUCT_CLI = 2;
  CLIENT_PRODUCT_ANDROID = 3;
  CLIENT_PRODUCT_IOS = 4;
  CLIENT_PRODUCT_DESKTOP_GUI = 5;
}

// AgentPresence 是 Edge 内存中一个已认证 daemon 连接的实时投影。
// R2 只由测试事件生成；R4 才由真实 AgentGateway 写入。
message AgentPresence {
  string daemon_id = 1;
  string account_id = 2;
  string boot_id = 3;
  string connection_id = 4;
  uint64 generation = 5;
  string ticket_id = 6;
  google.protobuf.Timestamp ticket_issued_at = 7;
}

// ClientSessionSummary 是 Edge 内存中一个客户端信令会话的实时投影。
// 该消息不包含 SDP、ICE、CapabilityGrant 或 terminal 业务内容。
message ClientSessionSummary {
  string session_id = 1;
  string account_id = 2;
  string daemon_id = 3;
  string client_id = 4;
  ClientProduct product = 5;
  uint64 generation = 6;
}

// RelayAllocationSummary 是 Edge 内存 runtime 的脱敏 allocation 投影。
// credential、SDP、candidate 和 payload 都不得进入该消息。
message RelayAllocationSummary {
  string allocation_id = 1;
  string session_id = 2;
  string lease_id = 3;
  string account_id = 4;
  RelayTransport transport = 5;
  uint64 generation = 6;
  uint64 ingress_bytes = 7;
  uint64 egress_bytes = 8;
  google.protobuf.Timestamp started_at = 9;
}

// RuntimeSnapshot 是 Edge 在某个单调 revision 上的一致性运行时投影。
message RuntimeSnapshot {
  uint64 revision = 1;
  repeated AgentPresence agents = 2;
  repeated ClientSessionSummary sessions = 3;
  repeated RelayAllocationSummary allocations = 4;
}

message AgentRemoved {
  string daemon_id = 1;
  uint64 generation = 2;
}

message ClientSessionRemoved {
  string session_id = 1;
  uint64 generation = 2;
}

message RelayAllocationRemoved {
  string allocation_id = 1;
  uint64 generation = 2;
}

// RuntimeDelta 是快照 revision 之后严格连续的一次运行时变更。
message RuntimeDelta {
  uint64 revision = 1;
  oneof change {
    AgentPresence agent_upserted = 10;
    AgentRemoved agent_removed = 11;
    ClientSessionSummary session_upserted = 12;
    ClientSessionRemoved session_removed = 13;
    RelayAllocationSummary allocation_upserted = 14;
    RelayAllocationRemoved allocation_removed = 15;
  }
}
