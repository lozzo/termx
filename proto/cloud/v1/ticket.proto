syntax = "proto3";

package muxvia.cloud.v1;

import "google/protobuf/timestamp.proto";
import "cloud/v1/runtime.proto";

option go_package = "github.com/muxvia/muxvia/proto/cloud/v1;cloudv1";

// AgentCapability 是 AgentTicket 冻结的 Edge 侧准入能力，不表达 terminal 权限。
enum AgentCapability {
  AGENT_CAPABILITY_UNSPECIFIED = 0;
  AGENT_CAPABILITY_SIGNALING = 1;
}

// AgentTicketClaims 把一次 daemon 到 Edge 的连接绑定到持久身份和短有效期。
message AgentTicketClaims {
  string ticket_id = 1;
  string daemon_id = 2;
  string account_id = 3;
  string edge_id = 4;
  string device_id = 5;
  bytes device_public_key = 6;
  repeated AgentCapability capabilities = 7;
  google.protobuf.Timestamp issued_at = 8;
  google.protobuf.Timestamp expires_at = 9;
}

// AgentHelloProofInput 把 DeviceIdentity proof 绑定到票据和当前 stream generation。
message AgentHelloProofInput {
  bytes ticket_payload_sha256 = 1;
  string daemon_id = 2;
  string boot_id = 3;
  string connection_id = 4;
}

// CloudRoutePolicy 是 ClientTicket 允许 Edge 执行的 managed Route 范围。
// P2P_OR_RELAY 仍需独立 RelayLease，不能由该枚举隐式放行 Relay 数据面。
enum CloudRoutePolicy {
  CLOUD_ROUTE_POLICY_UNSPECIFIED = 0;
  CLOUD_ROUTE_POLICY_P2P_ONLY = 1;
  CLOUD_ROUTE_POLICY_P2P_OR_RELAY = 2;
}

// CloudRouteGrantClaims 由 owning daemon 的 DeviceIdentity 签发，只授权发现和信令。
// 该消息不得出现 terminal、scope、CapabilityGrant、命令或文件字段。
message CloudRouteGrantClaims {
  string grant_id = 1;
  string daemon_id = 2;
  bytes client_public_key = 3;
  ClientProduct product = 4;
  google.protobuf.Timestamp issued_at = 5;
  google.protobuf.Timestamp expires_at = 6;
}

// PairingRouteGrantClaims 由 owning daemon 签发，只允许 Cloud 为一个活动 claim 建立 pairing-only signaling。
// pairing_claim_sha256 不足以兑换 claim，Cloud 不接收 128-bit claim 本体。
message PairingRouteGrantClaims {
  string grant_id = 1;
  string daemon_id = 2;
  string device_id = 3;
  bytes pairing_claim_sha256 = 4;
  google.protobuf.Timestamp issued_at = 5;
  google.protobuf.Timestamp expires_at = 6;
}

// ClientRouteProofInput 把客户端 proof 绑定到 Controller nonce、grant 和本次解析请求。
message ClientRouteProofInput {
  string challenge_id = 1;
  bytes challenge = 2;
  bytes grant_payload_sha256 = 3;
  string request_id = 4;
}

// PairingRouteProofInput 证明首次配对请求持有即将绑定到 claim 的 ClientAccessIdentity。
// Controller 只看到 daemon 签名 bootstrap grant 的摘要；真正的 claim 仍只在端到端 DataChannel 内由 daemon 消费。
message PairingRouteProofInput {
  string challenge_id = 1;
  bytes challenge = 2;
  bytes pairing_route_grant_payload_sha256 = 3;
  string request_id = 4;
}

// ClientTicketClaims 是 Controller 对单个在线 Edge 信令 attempt 的两分钟准入票据。
message ClientTicketClaims {
  string ticket_id = 1;
  string account_id = 2;
  string edge_id = 3;
  string daemon_id = 4;
  string client_id = 5;
  bytes client_public_key = 6;
  ClientProduct product = 7;
  CloudRoutePolicy route_policy = 8;
  google.protobuf.Timestamp issued_at = 9;
  google.protobuf.Timestamp expires_at = 10;
  CloudClientAccessMode access_mode = 11;
  bytes pairing_claim_sha256 = 12;
}

// ClientHelloProofInput 把 ClientAccessIdentity proof 绑定到票据和当前 attempt generation。
message ClientHelloProofInput {
  bytes ticket_payload_sha256 = 1;
  string session_id = 2;
  uint64 attempt_generation = 3;
}
