syntax = "proto3";

package anytty.cloud.v1;

import "google/protobuf/timestamp.proto";
import "cloud/v1/runtime.proto";

option go_package = "github.com/anytty/anytty/proto/cloud/v1;cloudv1";

// AgentCapability 是 AgentTicket 冻结的 Edge 侧准入能力，不表达 terminal 权限。
enum AgentCapability {
  AGENT_CAPABILITY_UNSPECIFIED = 0;
  AGENT_CAPABILITY_SIGNALING = 1;
}

// AgentRelayDelegation 是 Controller 在 daemon 接入时冻结给 Edge 的 Relay 上限。
// EdgeControl 中断后，Edge 只能在这些上限内为已由 daemon 批准的客户端创建短租约。
message AgentRelayDelegation {
  uint64 max_bytes_per_lease = 1;
  uint64 max_rate_bytes_per_second = 2;
  uint32 max_concurrent_allocations = 3;
}

// AgentTicketClaims 把一次 daemon 到 Edge 的连接绑定到持久身份和短有效期。
message AgentTicketClaims {
  string ticket_id = 1;
  string daemon_id = 2;
  string account_id = 3;
  string edge_id = 4;
  string device_id = 5;
  bytes device_public_key = 6;
  repeated AgentCapability capabilities = 7;
  google.protobuf.Timestamp issued_at = 8;
  google.protobuf.Timestamp expires_at = 9;
  AgentRelayDelegation relay_delegation = 10;
}

// AgentHelloProofInput 把 DeviceIdentity proof 绑定到票据和当前 stream generation。
message AgentHelloProofInput {
  bytes ticket_payload_sha256 = 1;
  string daemon_id = 2;
  string boot_id = 3;
  string connection_id = 4;
}

// CloudRouteGrantClaims 由 owning daemon 的 DeviceIdentity 签发，只授权发现和信令。
// 该消息不得出现 terminal、scope、CapabilityGrant、命令或文件字段。
message CloudRouteGrantClaims {
  string grant_id = 1;
  string daemon_id = 2;
  bytes client_public_key = 3;
  ClientProduct product = 4;
  google.protobuf.Timestamp issued_at = 5;
  google.protobuf.Timestamp expires_at = 6;
}

// PairingRouteGrantClaims 由 owning daemon 签发，只允许 Cloud 为一个活动 claim 建立 pairing-only signaling。
// pairing_claim_sha256 不足以兑换 claim，Cloud 不接收 128-bit claim 本体。
message PairingRouteGrantClaims {
  string grant_id = 1;
  string daemon_id = 2;
  string device_id = 3;
  bytes pairing_claim_sha256 = 4;
  google.protobuf.Timestamp issued_at = 5;
  google.protobuf.Timestamp expires_at = 6;
}

// ClientRouteProofInput 把客户端 proof 绑定到 Controller nonce、grant 和本次解析请求。
message ClientRouteProofInput {
  string challenge_id = 1;
  bytes challenge = 2;
  bytes grant_payload_sha256 = 3;
  string request_id = 4;
}

// PairingRouteProofInput 证明首次配对请求持有即将绑定到 claim 的 ClientAccessIdentity。
// Controller 只看到 daemon 签名 bootstrap grant 的摘要；真正的 claim 仍只在端到端 DataChannel 内由 daemon 消费。
message PairingRouteProofInput {
  string challenge_id = 1;
  bytes challenge = 2;
  bytes pairing_route_grant_payload_sha256 = 3;
  string request_id = 4;
}

// CloudRouteHelloProofInput 把 daemon 签名的长期 Route grant 绑定到当前 Edge 和单次 stream generation。
// grant 可复用，但每次连接都必须由同一 ClientAccessIdentity 重新签名，复制 grant 本身不能建立连接。
message CloudRouteHelloProofInput {
  bytes route_grant_payload_sha256 = 1;
  string edge_id = 2;
  string session_id = 3;
  uint64 attempt_generation = 4;
}
