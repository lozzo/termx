syntax = "proto3";

package anytty.cloud.v1;

import "google/protobuf/timestamp.proto";
import "cloud/v1/runtime.proto";

option go_package = "github.com/anytty/anytty/proto/cloud/v1;cloudv1";

// DaemonCapability 是 enrollment 时授予 daemon 的 Edge 侧能力，不表达 terminal 权限。
enum DaemonCapability {
  DAEMON_CAPABILITY_UNSPECIFIED = 0;
  DAEMON_CAPABILITY_SIGNALING = 1;
}

// DaemonRelayDelegation 是 Controller 授予 Edge 的 Relay 上限。
// Edge 只能在这些上限内为已由 daemon 批准的客户端创建本地短租约。
message DaemonRelayDelegation {
  uint64 max_bytes_per_lease = 1;
  uint64 max_rate_bytes_per_second = 2;
  uint32 max_concurrent_allocations = 3;
}

// DaemonBindingClaims 是 enrollment 的持久结果。它只绑定 daemon 身份和 owning Edge，
// 不是 bearer token；每次 AgentGateway 连接仍必须证明 DeviceIdentity 私钥持有权。
message DaemonBindingClaims {
  string binding_id = 1;
  string daemon_id = 2;
  string account_id = 3;
  string edge_id = 4;
  string device_id = 5;
  bytes device_public_key = 6;
  repeated DaemonCapability capabilities = 7;
  google.protobuf.Timestamp issued_at = 8;
  google.protobuf.Timestamp expires_at = 9;
  DaemonRelayDelegation relay_delegation = 10;
  uint64 revision = 11;
  bytes edge_locator_sha256 = 12;
}

// AgentHelloProofInput 把 DeviceIdentity proof 绑定到持久 binding 和当前 stream generation。
message AgentHelloProofInput {
  bytes binding_payload_sha256 = 1;
  string daemon_id = 2;
  string boot_id = 3;
  string connection_id = 4;
}

// CloudRouteGrantClaims 由 owning daemon 的 DeviceIdentity 签发，只授权发现和信令。
// 该消息不得出现 terminal、scope、CapabilityGrant、命令或文件字段。
message CloudRouteGrantClaims {
  string grant_id = 1;
  string daemon_id = 2;
  bytes client_public_key = 3;
  ClientProduct product = 4;
  google.protobuf.Timestamp issued_at = 5;
  google.protobuf.Timestamp expires_at = 6;
}

// ClientRouteProofInput 把客户端 proof 绑定到 Controller nonce、grant 和本次解析请求。
message ClientRouteProofInput {
  string challenge_id = 1;
  bytes challenge = 2;
  bytes grant_payload_sha256 = 3;
  string request_id = 4;
}

// CloudRouteHelloProofInput 把 daemon 签名的长期 Route grant 绑定到当前 Edge 和单次 stream generation。
// grant 可复用，但每次连接都必须由同一 ClientAccessIdentity 重新签名，复制 grant 本身不能建立连接。
message CloudRouteHelloProofInput {
  bytes route_grant_payload_sha256 = 1;
  string edge_id = 2;
  string session_id = 3;
  uint64 attempt_generation = 4;
}

// PairingHelloProofInput 把紧凑 pairing admission 的全部安全字段绑定到目标 Edge 和单次 stream。
// proof 由新建的 ClientAccessIdentity 签名；Edge 只接收 claim 摘要，不接收 128-bit claim 本体。
message PairingHelloProofInput {
  bytes pairing_admission_sha256 = 1;
  string edge_id = 2;
  string session_id = 3;
  uint64 attempt_generation = 4;
  ClientProduct product = 5;
}
