syntax = "proto3";

package muxvia.cloud.v1;

import "cloud/v1/common.proto";
import "cloud/v1/runtime.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/muxvia/muxvia/proto/cloud/v1;cloudv1";

// CloudICECandidate 是 Cloud 信令的中性 candidate；不携带授权或 terminal 数据。
message CloudICECandidate {
  string candidate = 1;
  string sdp_mid = 2;
  uint32 sdp_mline_index = 3;
  string username_fragment = 4;
}

message ClientHello {
  SignedEnvelope client_ticket = 1;
  bytes client_proof = 2;
  ClientProduct product = 3;
  string software_version = 4;
  uint64 attempt_generation = 5;
}

message ClientReady {
  string session_id = 1;
  uint64 generation = 2;
}

message ClientOffer {
  string session_id = 1;
  string offer_sdp = 2;
  repeated CloudICECandidate candidates = 3;
}

message EdgeAnswer {
  string session_id = 1;
  string answer_sdp = 2;
  repeated CloudICECandidate candidates = 3;
}

message SignalRejected {
  string session_id = 1;
  string code = 2;
  string message = 3;
}

message ClientSignal {
  uint32 protocol_version = 1;
  string message_id = 2;
  string sender_id = 3;
  string boot_id = 4;
  string connection_id = 5;
  uint64 stream_seq = 6;
  google.protobuf.Timestamp sent_at = 7;
  oneof payload {
    ClientHello hello = 20;
    ClientOffer offer = 21;
  }
}

message EdgeSignal {
  uint32 protocol_version = 1;
  string message_id = 2;
  string sender_id = 3;
  string boot_id = 4;
  string connection_id = 5;
  uint64 stream_seq = 6;
  google.protobuf.Timestamp sent_at = 7;
  oneof payload {
    ClientReady ready = 20;
    EdgeAnswer answer = 21;
    SignalRejected rejected = 22;
  }
}

// ClientGateway 只承载 Cloud WebRTC 信令；DataChannel 建立后业务流量完全绕过该 stream。
service ClientGateway {
  rpc Connect(stream ClientSignal) returns (stream EdgeSignal);
}
