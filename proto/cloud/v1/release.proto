syntax = "proto3";

package muxvia.cloud.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/muxvia/muxvia/proto/cloud/v1;cloudv1";

enum EdgeRolloutState {
  EDGE_ROLLOUT_STATE_UNSPECIFIED = 0;
  EDGE_ROLLOUT_STATE_REQUESTED = 1;
  EDGE_ROLLOUT_STATE_STAGED = 2;
  EDGE_ROLLOUT_STATE_DRAINING = 3;
  EDGE_ROLLOUT_STATE_ACTIVATING = 4;
  EDGE_ROLLOUT_STATE_HEALTHY = 5;
  EDGE_ROLLOUT_STATE_ROLLED_BACK = 6;
  EDGE_ROLLOUT_STATE_FAILED = 7;
}

// EdgeReleaseManifest 是不可变 Linux/amd64 Edge artifact 的可签名 payload。
message EdgeReleaseManifest {
  string artifact_id = 1;
  string version = 2;
  string operating_system = 3;
  string architecture = 4;
  string download_url = 5;
  bytes sha256 = 6;
  uint64 size_bytes = 7;
  google.protobuf.Timestamp created_at = 8;
}

// SignedEdgeReleaseManifest 使用 artifact release 专用签名域。
message SignedEdgeReleaseManifest {
  string key_id = 1;
  bytes payload = 2;
  bytes signature = 3;
}

message ReleaseArtifact {
  EdgeReleaseManifest manifest = 1;
  SignedEdgeReleaseManifest signed_manifest = 2;
  string channel = 3;
}

message EdgeReleaseRollout {
  string rollout_id = 1;
  string edge_id = 2;
  string artifact_id = 3;
  string target_version = 4;
  string previous_version = 5;
  EdgeRolloutState state = 6;
  string last_error_code = 7;
  uint64 revision = 8;
  google.protobuf.Timestamp requested_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message ListReleaseArtifactsRequest {}
message ListReleaseArtifactsResponse {
  repeated ReleaseArtifact artifacts = 1;
  repeated EdgeReleaseRollout rollouts = 2;
}

message StartEdgeRolloutRequest {
  string edge_id = 1;
  string artifact_id = 2;
  string reason = 3;
}
message StartEdgeRolloutResponse {
  EdgeReleaseRollout rollout = 1;
}

message RollbackEdgeReleaseRequest {
  string edge_id = 1;
  string reason = 2;
}
message RollbackEdgeReleaseResponse {
  EdgeReleaseRollout rollout = 1;
}

message StageEdgeRelease {
  string rollout_id = 1;
  SignedEdgeReleaseManifest manifest = 2;
}

message EdgeReleaseStaged {
  string rollout_id = 1;
  string artifact_id = 2;
  bool staged = 3;
  string error_code = 4;
}

message DrainEdgeRelease {
  string rollout_id = 1;
  google.protobuf.Timestamp deadline = 2;
}

message EdgeReleaseDrained {
  string rollout_id = 1;
  bool drained = 2;
  string error_code = 3;
}

message ActivateEdgeRelease {
  string rollout_id = 1;
  string artifact_id = 2;
  string target_version = 3;
}

message EdgeReleaseActivation {
  string rollout_id = 1;
  bool accepted = 2;
  string error_code = 3;
}

message EdgeReleaseResult {
  string rollout_id = 1;
  string target_version = 2;
  string running_version = 3;
  EdgeRolloutState state = 4;
  string error_code = 5;
}
