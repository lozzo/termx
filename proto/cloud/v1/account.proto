syntax = "proto3";

package anytty.cloud.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/anytty/anytty/proto/cloud/v1;cloudv1";

// AccountState 是账号持久状态；禁用后所有新的 Cloud 准入都必须拒绝。
enum AccountState {
  ACCOUNT_STATE_UNSPECIFIED = 0;
  ACCOUNT_STATE_ACTIVE = 1;
  ACCOUNT_STATE_DISABLED = 2;
}

// AccountRole 是 Controller RBAC 的稳定角色，不由浏览器自行推断权限。
enum AccountRole {
  ACCOUNT_ROLE_UNSPECIFIED = 0;
  ACCOUNT_ROLE_USER = 1;
  ACCOUNT_ROLE_OPERATOR = 2;
  ACCOUNT_ROLE_ADMIN = 3;
}

// AccountProfile 是账号持久投影，不包含密码 verifier 或 session secret。
message AccountProfile {
  string account_id = 1;
  string email = 2;
  string display_name = 3;
  AccountState state = 4;
  uint64 revision = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// AccountSessionCredential 只在创建或轮换 session 时返回原始 token。
message AccountSessionCredential {
  string session_id = 1;
  bytes access_token = 2;
  bytes refresh_token = 3;
  google.protobuf.Timestamp access_expires_at = 4;
  google.protobuf.Timestamp refresh_expires_at = 5;
  bytes csrf_token = 6;
}

message LoginAccountRequest {
  string login = 1;
  string password = 2;
}

message LoginAccountResponse {
  AccountProfile account = 1;
  repeated AccountRole roles = 2;
  AccountSessionCredential session = 3;
}

message RefreshAccountSessionRequest { bytes refresh_token = 1; }

message RefreshAccountSessionResponse {
  AccountProfile account = 1;
  repeated AccountRole roles = 2;
  AccountSessionCredential session = 3;
}

message LogoutAccountSessionRequest {
  string session_id = 1;
  bool all_sessions = 2;
}

message LogoutAccountSessionResponse {}

message GetCurrentAccountRequest {}

message GetCurrentAccountResponse {
  AccountProfile account = 1;
  repeated AccountRole roles = 2;
  google.protobuf.Timestamp recent_auth_expires_at = 3;
}

message VerifyRecentAuthenticationRequest { string password = 1; }

message VerifyRecentAuthenticationResponse {
  google.protobuf.Timestamp expires_at = 1;
}

// AccountSessionProjection 是用户可见的 session 元数据，不包含任何 token 摘要或原始 credential。
message AccountSessionProjection {
  string session_id = 1;
  bool current = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp access_expires_at = 4;
  google.protobuf.Timestamp refresh_expires_at = 5;
  google.protobuf.Timestamp recent_auth_expires_at = 6;
  uint64 revision = 7;
}

message ListAccountSessionsRequest {}
message ListAccountSessionsResponse { repeated AccountSessionProjection sessions = 1; }

message ChangeAccountPasswordRequest {
  string current_password = 1;
  string new_password = 2;
}
message ChangeAccountPasswordResponse { AccountProfile account = 1; }

message RevokeAccountSessionRequest { string session_id = 1; }
message RevokeAccountSessionResponse {}

// AccountService 是账号、credential 和 Web session 的唯一公共应用 API。
service AccountService {
  rpc Login(LoginAccountRequest) returns (LoginAccountResponse);
  rpc Refresh(RefreshAccountSessionRequest) returns (RefreshAccountSessionResponse);
  rpc Logout(LogoutAccountSessionRequest) returns (LogoutAccountSessionResponse);
  rpc GetCurrent(GetCurrentAccountRequest) returns (GetCurrentAccountResponse);
  rpc VerifyRecentAuthentication(VerifyRecentAuthenticationRequest) returns (VerifyRecentAuthenticationResponse);
  rpc ListSessions(ListAccountSessionsRequest) returns (ListAccountSessionsResponse);
  rpc ChangePassword(ChangeAccountPasswordRequest) returns (ChangeAccountPasswordResponse);
  rpc RevokeSession(RevokeAccountSessionRequest) returns (RevokeAccountSessionResponse);
}
