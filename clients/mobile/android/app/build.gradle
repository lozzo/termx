apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.protobuf'

def termxCloudModuleRoot = new File(rootProject.rootDir, '../../../private/cloud/mobile/android').canonicalFile
def termxDevCloudEnabled = project.hasProperty('termxDevCloud') && project.property('termxDevCloud') == 'true'
def termxPublicHTTPStagingEnabled = project.hasProperty('termxPublicHTTPStaging') && project.property('termxPublicHTTPStaging') == 'true'
if (termxDevCloudEnabled && termxPublicHTTPStagingEnabled) {
    throw new GradleException('Loopback and public HTTP staging profiles are mutually exclusive')
}

android {
    namespace = "com.termx.app"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion "27.2.12479018"
    defaultConfig {
        applicationId "com.termx.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField 'boolean', 'TERMX_DEV_CLOUD_ENABLED', (termxDevCloudEnabled || termxPublicHTTPStagingEnabled).toString()
        buildConfigField 'boolean', 'TERMX_PUBLIC_HTTP_STAGING_ENABLED', termxPublicHTTPStagingEnabled.toString()
        buildConfigField 'String', 'TERMX_DEV_CONTROL_URL', termxPublicHTTPStagingEnabled ? '"http://114.66.58.243:41101"' : '"http://127.0.0.1:41001"'
        buildConfigField 'String', 'TERMX_DEV_HUB_URL', termxPublicHTTPStagingEnabled ? '"http://114.66.58.243:41102"' : '"http://127.0.0.1:41002"'
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig true
    }
    sourceSets {
        test.resources.srcDir '../../../../shared/cloudcompanion/testdata'
        test.resources.srcDir '../../../../client/endpoint/testdata'
        main.proto.srcDir '../../../../proto'
        main.jniLibs.srcDir "$buildDir/generated/termxJniLibs"
        main.java.srcDir new File(termxCloudModuleRoot, 'src/main/kotlin')
        test.java.srcDir new File(termxCloudModuleRoot, 'src/test/kotlin')
    }
    if (project.hasProperty("termxArmOnly")) {
        splits {
            abi {
                enable true
                reset()
                include "arm64-v8a"
                universalApk false
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            proguardFiles new File(termxCloudModuleRoot, 'official-proguard-rules.pro')
        }
    }
}

def termxAndroidGoTags = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") } ? "" : "termx_android_spike"

tasks.register("buildTermxClientNative", Exec) {
    workingDir rootProject.projectDir
    commandLine file('../../../../scripts/build-android-client.sh').absolutePath, "$buildDir/generated/termxJniLibs"
    environment "TERMX_ANDROID_GO_TAGS", termxAndroidGoTags
    inputs.property "termxAndroidGoTags", termxAndroidGoTags
    inputs.files(
        fileTree('../../../../client'),
        fileTree('../../../../api_layer'),
        fileTree('../../../../core'),
        fileTree('../../../../internal/protocol'),
        fileTree('../../../../remote'),
        fileTree('../../../../shared'),
        fileTree('../../../../proto'),
        file('src/main/cpp/termx_client_jni.c')
    )
    outputs.dir "$buildDir/generated/termxJniLibs"
}

tasks.named("preBuild").configure {
    dependsOn tasks.named("buildTermxClientNative")
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    // termx NativeConnection dependencies
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.java-websocket:Java-WebSocket:1.5.6'
    implementation 'com.google.protobuf:protobuf-java:3.25.5'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.79'
    implementation 'androidx.lifecycle:lifecycle-process:2.7.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20240303'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.5'
    }
    generateProtoTasks {
        all().configureEach { task ->
            task.builtins {
                java {}
            }
        }
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
