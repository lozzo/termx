# tui config example
#
# 建议保存为：
#   ~/.config/termx/tui-v3.yaml
#
# 解析规则：
# - 缩进必须使用两个空格。
# - 当前配置只支持 scalar 值，不支持 YAML list。
# - 字符串可以不加引号；包含 #、Nerd Font glyph、Go template、前后空格时建议使用双引号。
# - 颜色字段只接受空字符串 "" 或 "#RRGGBB"。
# - true/false 必须写成小写布尔值。
# - 这个文件本身是可加载配置，也可以作为逐项说明使用。

# version 是配置 schema 版本。
# 当前唯一有效值：1。
version: 1

tui:
  # profile 是当前 TUI 客户端配置档名称。
  # 用途：给未来多 profile、诊断输出或 UI 标识使用；不表达 terminal/session 状态。
  # 默认值：default。
  profile: default

  theme:
    # mode 控制整体明暗偏好。
    # 可选值：dark、light、system。
    # system 表示跟随宿主环境；如果宿主无法提供明暗信息，渲染层会按默认主题处理。
    # 默认值：dark。
    mode: dark

    # palette 控制基础 palette 来源。
    # 可选值：host、builtin。
    # host 会优先尊重宿主终端/环境；builtin 使用 TermX 内置 palette。
    # 下面的颜色字段非空时会覆盖 palette 派生值。
    # 默认值：host。
    palette: host

    # primary 是主要强调色，用于 active、重点 action、匹配高亮等 UI token。
    # 留空 "" 表示使用 palette 默认值。
    # 格式："" 或 "#RRGGBB"。
    primary: "#a970ff"

    # secondary 是次级强调色，用于辅助强调、局部状态或补充高亮。
    # 留空 "" 表示使用 palette 默认值。
    # 格式："" 或 "#RRGGBB"。
    secondary: "#7ab8ff"

    # foreground 是普通 chrome 文本的默认前景色。
    # 不影响真实 terminal 内容的 SGR 颜色；terminal 内容颜色来自 core/vterm 语义。
    # 留空 "" 表示使用 palette 默认值。
    foreground: ""

    # background 是普通 chrome 背景的默认颜色。
    # 留空 "" 表示使用 palette 默认值。
    background: ""

    # muted 是弱化文本颜色，用于说明性状态、非活跃 label、低优先级 metadata。
    # 留空 "" 表示使用 palette 默认值。
    muted: ""

    # success 是成功状态颜色。
    # 留空 "" 表示使用 palette 默认值。
    success: ""

    # warning 是警告状态颜色。
    # 留空 "" 表示使用 palette 默认值。
    warning: ""

    # danger 是危险/破坏性操作颜色，例如 close/delete 类 action。
    # 留空 "" 表示使用 palette 默认值。
    danger: ""

    # info 是信息状态颜色。
    # 留空 "" 表示使用 palette 默认值。
    info: ""

    border:
      # panel 是 pane 分隔线或普通边框颜色。
      # 留空 "" 表示使用 palette 默认值。
      panel: ""

      # active 是 active pane/tab/workspace 相关边框颜色。
      # 留空 "" 表示使用 palette 默认值。
      active: ""

      # inactive 是非活跃 pane 边框颜色。
      # 留空 "" 表示使用 palette 默认值。
      inactive: ""

      # muted 是弱化边框颜色，用于低优先级或 disabled-like chrome。
      # 留空 "" 表示使用 palette 默认值。
      muted: ""

    surface:
      # chrome_bg 是 header/footer/pane chrome 的背景色。
      # 留空 "" 表示使用 palette 默认值。
      chrome_bg: ""

      # status_bg 是状态条、footer action 区域的背景色。
      # 留空 "" 表示使用 palette 默认值。
      status_bg: ""

      # overlay_bg 是 overlay/picker/prompt 类浮层背景色。
      # 留空 "" 表示使用 palette 默认值。
      overlay_bg: ""

      # toast_bg 是 toast/notice 类临时提示背景色。
      # 留空 "" 表示使用 palette 默认值。
      toast_bg: ""

  chrome:
    # header 控制顶部 header 是否显示。
    # true：显示 workspace、tab strip、notice 等顶部 chrome。
    # false：隐藏 header；不改变 workspace/tab/pane 的实际状态。
    # 默认值：true。
    header: true

    # footer 控制底部 footer 是否显示。
    # true：显示 shortcut/action/status footer。
    # false：隐藏 footer；不改变 shortcuts 或 action dispatch。
    # 默认值：true。
    footer: true

    # panel_presentation 控制 pane chrome 呈现方式。
    # 可选值：
    # - split-line：更紧凑，pane 之间主要使用分隔线。
    # - card：每个 pane 有更完整的边框。
    # 这个值只影响渲染，不改变 pane id、terminal binding、active pane 或 copy mode 归属。
    # 默认值：split-line。
    panel_presentation: split-line

    # tab_create_icon 是 tab strip 上创建新 tab 的按钮内容。
    # 建议使用 Nerd Font glyph；如果宿主字体不支持，可以改成 "+"。
    # 这个按钮的 action 仍是固定的 tab.create；这里只配置显示内容。
    # 默认值："󰐕"。
    tab_create_icon: "󰐕"

    # tab_create_template 控制创建 tab 按钮的完整格式。
    # 这个模板只改变显示和 tab.create hit region，不改变新建 tab 的 reducer 消息链路。
    # 可用变量/函数：create_icon、fg、bg、style、action、end_style。
    # 留空时使用内置按钮格式。
    tab_create_template: ""

    # workspace_template 控制 header 左侧 workspace 胶囊。
    # 这个模板只改变显示和打开 Navigator 的 hit region，不修改 workspace truth。
    # 可用变量/函数：workspace、workspace_id、title、truncate、fg、bg、style、action、end_style。
    workspace_template: "[style:header-workspace-edge][/style][style:header-workspace]  {{workspace | truncate 18}} [/style][style:header-workspace-edge][/style][style:header-spacer] [/style]"

    # tab_template 控制 header tab 的完整格式。
    # 默认值使用主题派生色做 active tab 胶囊，并保证 active/inactive 宽度一致。
    #
    # 表达式引擎：
    # - 使用 Go 标准库 text/template，不维护自定义 if 表达式语言。
    # - 可用变量/函数：tab_id、id、index、tab_index、title、active、not_active、marker、close_icon。
    # - 条件示例：{{if active}}▎{{else}}|{{end}}。
    # - 宽度裁切：{{title | truncate 14}}，按 terminal cell 宽度裁切。
    # - span helper：{{fg "#ffffff"}}、{{bg "#332244"}}、{{style "header-active-title"}}、
    #   {{action "tab.close"}}、{{end_style}}、{{end_action}}。
    # - 也可以使用 struct 字段：{{.TabID}}、{{.Index}}、{{.Title}}、{{.Active}}。
    #
    # TermX span 语法：
    # - span 在 text/template 执行后解析；动态 title 里的 [action:...] 只会作为文字显示。
    # - [fg:#RRGGBB] 设置后续片段前景色；[bg:#RRGGBB] 设置背景色。
    # - [fg:#RRGGBB;bg:#RRGGBB;font:bold] 可以组合多个样式。
    # - font 支持 bold、italic、underline、strike；也可写成 [bold]、[italic]、[underline]。
    # - [style:header-active-title] 切换到内置 style token。
    # - [/style] 或 [reset] 恢复当前 tab 的默认样式。
    # - [action:tab.close]...[/action] 把片段绑定到关闭当前 tab。
    # - 未显式标注 action 的片段默认绑定 tab.switch，点击会跳转到该 tab。
    #
    # 常用内置 style token：
    # - header-workspace、header-workspace-edge
    # - header-active-edge、header-active-marker、header-active-index、header-active-title、header-active-close
    # - header-inactive-index、header-inactive-title、header-inactive-close
    # - header-create、status、status-muted、status-warning、accent、muted
    #
    # 注意：
    # - 这个字段必须是单行字符串。
    # - 复杂 Powerline/Nerd Font glyph 是否等宽，取决于宿主终端字体。
    # - 为了避免切换 active 状态时 tab 宽度跳动，active 和 inactive 分支最好输出相同 cell 宽度。
    tab_template: "{{if active}}[style:header-active-edge][/style][style:header-active-marker]{{marker}}[/style][style:header-active-index] {{index}}[/style][style:header-active-title] {{title | truncate 14}} [/style][action:tab.close][style:header-active-close]{{close_icon}}[/style][/action][style:header-active-edge][/style]{{else}}[style:header-spacer] [/style][style:header-spacer]{{marker}}[/style][style:header-inactive-index] {{index}}[/style][style:header-inactive-title] {{title | truncate 14}} [/style][action:tab.close][style:header-inactive-close]{{close_icon}}[/style][/action][style:header-spacer] [/style]{{end}}"

    # pane_title_template 控制 pane/floating 顶部 terminal 标题。
    # 默认值：""，表示使用 terminal pool 名称；可以配置成 terminal@机器名 这类格式。
    # 可用变量/函数：{{terminal}}、{{terminal_title}}、{{terminal_id}}、{{endpoint}}、
    # {{endpoint_label}}、{{endpoint_id}}、{{pane}}、{{pane_title}}、{{terminal | truncate 16}}。
    # 这个模板只影响展示，不改变 EndpointID + TerminalID 路由。
    pane_title_template: "{{terminal}}@{{endpoint}}"

    # pane_glyphs 控制 pane/floating chrome 右上角和状态区的显示字形与左右装饰。
    # 它只改显示，不改变 action id、鼠标 hit region 或 reducer 消息链路。
    # 例如右上角默认语义仍是 zoom / split right / split down / close。
    # action_left/action_right 是每个 action token 的左右部，默认等价于 "[" 和 "]"。
    # action_group_left/action_group_right 是整组 action 的最外层左右部，可做 Powerline 半圆胶囊。
    # 这些模板支持和 tab_template 相同的 text/template 占位符与 TermX span：
    # - action token 可用 {{glyph}}、{{action_id}}、{{label}}、{{index}}、{{count}}、{{first}}、{{last}}、{{active}}、{{not_active}}、{{is_zoom_mode}}、{{not_zoom_mode}}。
    # - owner token 可用 {{text}}。
    # - [fg:#RRGGBB;bg:#RRGGBB;font:bold]、[style:accent]、[reset] 会作为样式解析。
    # - 显式写成 "" 表示隐藏对应左部/右部/分隔符；没写则使用默认值。
    pane_glyphs:
      action_left: " "
      action_right: " "
      action_separator: ""
      action_group_left: "[fg:{{if active}}#8ffcff{{else}}#ff6bff{{end}}][fg:#071112;bg:{{if active}}#8ffcff{{else}}#ff6bff{{end}};font:bold]"
      action_group_right: "[reset][fg:{{if active}}#8ffcff{{else}}#ff6bff{{end}}][reset]"
      owner_left: "[fg:#8ffcff][fg:#071112;bg:#8ffcff;font:bold] "
      owner_right: " [reset][fg:#8ffcff][reset]"
      owner: "owner"
      owner_pending: "owner?"
      take_owner: "follow"
      zoom: "󰁌"
      unzoom: "󰁄"
      split_vertical: "□"
      split_horizontal: "▭"
      close: "⤫"
      size_lock: ""
      size_unlock: ""
      center_floating: ""
      collapse_floating: ""
      running: ""
      waiting: ""
      exited: ""
      killed: ""
      # overflow_* 控制内容被裁切时四边 chrome 上的提示 glyph。
      # overflow_style 可写内置 style token（如 muted/accent）或 #RRGGBB。
      overflow_left: "‹"
      overflow_right: "›"
      overflow_top: "˄"
      overflow_bottom: "˅"
      overflow_style: "#c7c7c7"
      # extent_placeholder 控制 live terminal 尺寸小于 pane 时外部区域的占位点。
      # glyph 必须是单 cell；style 同样支持 style token 或 #RRGGBB。
      extent_placeholder: "·"
      extent_placeholder_style: "#a8a8a8"

  footer:
    # templates 控制 footer 的轻量文本模板。
    # 这里不是完整可编程布局；它只做占位符替换，真实 action/hit region 仍由 render ActionSpec 和 app reducer 管。
    templates:
      # mode_badge 是 footer 左侧 mode 标识模板。
      # 可用占位符：
      # - {{mode}}：当前 mode，例如 live、pane、resize、copy、terminal-picker。
      # - {{mode_icon}}：modes.<mode>.icon 配置的图标。
      # - {{mode_label}}：modes.<mode>.label 配置的文字。
      # 默认值："{{mode_icon}} {{mode_label}}"。
      mode_badge: "{{mode_icon}} {{mode_label}}"

      # key 控制 action 的 key block。
      # 默认值："{{key}}"，会显示 [Ctrl] • [W] / [enter] 这类结构化 key token。
      # 设为 "" 时隐藏 key，只保留 icon/label 和 click hit region。
      key: ""

      # action 是 action key 后面的提示模板。
      # 模板里的 {{key}} 只作为兼容占位符处理；key block 是否显示由上面的 templates.key 控制。
      # 可用占位符：
      # - {{key}}：兼容占位符；当前装饰区会吞掉它，避免和 key block 重复。
      # - {{icon}}：actions.<alias>.icon。
      # - {{label}}：actions.<alias>.label。
      # - {{action}}：actions.<alias>.id。
      # 默认值："{{key}} {{icon}} {{label}}"。
      action: "{{key}} {{icon}} {{label}}"

      # separator 是 action token 之间的分隔符。
      # 留空 "" 时使用内置分隔符；这里用更轻的点号。
      # 默认值：" │ "。
      separator: " · "

      # workspace_summary / floating_summary / terminals_summary 控制 footer 右侧摘要。
      # 这些字段只改变显示文本，不改变 workspace/floating/terminal 的状态来源。
      # 可用占位符：
      # - workspace_summary：{{workspace}}、{{value}}。
      # - 其他计数字段：{{count}}、{{value}}。
      # 默认值分别是 "ws:{{workspace}}"、"float:{{count}}"、"collapsed:{{count}}"、"terminals:{{count}}"。
      workspace_summary: "󰙅 {{workspace}}"
      floating_summary: "󰹙 {{count}}"
      floating_collapsed_summary: "󰃄 {{count}}"
      terminals_summary: " {{count}}"

      # tabs_summary / panes_summary 是旧手写 FooterVM 和调试摘要兼容模板。
      # 默认值："tabs:{{count}}" / "panes:{{count}}"。
      tabs_summary: "󰓩 {{count}}"
      panes_summary: " {{count}}"

      # keylock_on 是全局 shortcut lock 开启后，右侧 summary 里的显示文本。
      # 它只改变文案，不改变 Ctrl-G 解锁和 root shortcut 透传规则。
      # 默认值："󰌾 KEYLOCK"。
      keylock_on: "󰌾 KEYLOCK"

      # keylock_off 当前预留；关闭状态默认不显示 keylock token。
      # 默认值：""。
      keylock_off: ""

    # modes.<mode> 只控制某个 footer mode 的 badge。
    # <mode> 可以是 live、pane、resize、tab、workspace、floating、global、copy，
    # 也可以是 overlay mode：terminal-picker、terminal-pool、workbench-tree、clipboard-history、help 等。
    # footer action、快捷键和文案统一由 tui.shortcuts 生成。
    modes:
      live:
        icon: "󰆍"
        label: "TERM"
        style: footer-accent

      copy:
        icon: "󰆏"
        label: "COPY"
        style: footer-key-copy

      terminal-picker:
        icon: "󰱼"
        label: "PICK"
        style: footer-key-picker

      # resize:
      #   icon: "󰙖"
      #   label: "SIZE"
      #   style: footer-key-resize

  interaction:
    # mouse 控制是否启用鼠标 hit region。
    # true：点击 header/tab/pane/overlay 等 UI 可触发 action。
    # false：关闭鼠标交互，仅保留键盘。
    # 默认值：true。
    mouse: true

    # sticky_prefix_timeout_ms 控制 sticky shortcut mode 的空闲退出时间。
    # 单位：毫秒。
    # 0 表示进入 sticky mode 后不因空闲超时退出。
    # 默认值：3000。
    sticky_prefix_timeout_ms: 3000

    # shortcut_passthrough_interval_ms 控制“入口键双击透传”的判定窗口。
    # 例如 ctrl-w 进入 workspace mode 后，在这个时间内再按一次 ctrl-w 会向 terminal 透传一次 ctrl-w。
    # ctrl-v 进入 copy/history 后，在这个时间内再按一次 ctrl-v 会退出 copy/history 并透传一次 ctrl-v。
    # 单位：毫秒；必须大于 0。
    # 默认值：1000。
    shortcut_passthrough_interval_ms: 1000

    # confirm_destructive 控制危险操作是否需要确认。
    # true：close/delete 等 destructive action 需要确认。
    # false：直接执行，适合高度熟悉 shortcuts 的用户。
    # 默认值：true。
    confirm_destructive: true

    clipboard_history:
      # max_items 控制 TUI 本地 clipboard history 最多保留多少条。
      # 0 表示不保留历史条目。
      # 默认值：200。
      max_items: 200

      # name_width 控制 clipboard history picker 左侧名称列宽。
      # 单位：terminal cell；必须大于 0。
      # 默认值：34。
      name_width: 34

      # preview_width_ratio 控制 picker 里 preview 区占可用宽度的比例。
      # 取值范围：大于 0 且小于 1。
      # 默认值：0.68。
      preview_width_ratio: 0.68

    picker:
      # fuzzy_match 控制 picker 的模糊匹配算法。
      # 当前唯一可选值：subsequence。
      # 默认值：subsequence。
      fuzzy_match: subsequence

      # highlight_matches 控制 picker 是否高亮匹配字符。
      # true：高亮匹配片段。
      # false：只过滤结果，不做字符级高亮。
      # 默认值：true。
      highlight_matches: true

  # shortcuts 一旦写出就成为唯一快捷键真值；下面没有列出的默认快捷键不会自动继承。
  # 未修饰 Esc 是全局返回保留键，不需要也不允许写入任何 scene。
  shortcuts:
    actions:
      panel.close:
        label: close
      panel.kill_and_close:
        label: kill+close
      floating.new:
        label: new

    global:
      ctrl-p: menu.panel
      ctrl-g: menu.system
      ctrl-o: menu.floating
      ctrl-t: menu.tab
      ctrl-1: tab.jump.1

    system:
      h: system.toggle_header
      f: system.toggle_footer
      q: system.quit

    panel:
      x: panel.close
      k:
        action: panel.kill_and_close
        label: kill+close

    floating:
      n:
        action: floating.new
        show: true
      "[1...9]":
        action: floating.summon.{key}
        label: summon
        show: true
      o:
        action: floating.overview
        show: true
      x:
        action: floating.close
        show: true

    tab:
      "1": tab.jump.1
      "2": tab.jump.2
      n: tab.next
      p: tab.previous
      c: tab.create
      x: tab.close
