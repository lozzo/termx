server {
    listen 41102 ssl http2;
    server_name cn1.edge.muxvia.com;

    ssl_certificate /etc/nginx/ssl/muxvia-edge-secondary/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/muxvia-edge-secondary/privkey.pem;

    location = /healthz {
        proxy_pass http://127.0.0.1:42102/healthz;
    }

    location / {
        proxy_pass http://127.0.0.1:42101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
        client_max_body_size 4m;
    }
}
