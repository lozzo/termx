server {
    listen 80;
    server_name muxvia.com www.muxvia.com operator.muxvia.com control.muxvia.com us1.edge.muxvia.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name muxvia.com www.muxvia.com;

    ssl_certificate /etc/nginx/ssl/muxvia.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/muxvia.com/privkey.pem;

    location /assets/ {
        proxy_pass http://127.0.0.1:42001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:42001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 4m;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name operator.muxvia.com;

    ssl_certificate /etc/nginx/ssl/muxvia.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/muxvia.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:42003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 4m;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name control.muxvia.com;

    ssl_certificate /etc/nginx/ssl/muxvia.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/muxvia.com/privkey.pem;

    location / {
        allow 127.0.0.1;
        allow 155.94.155.192;
        allow 114.66.58.243;
        deny all;
        proxy_pass http://127.0.0.1:42002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        client_max_body_size 4m;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name us1.edge.muxvia.com;

    ssl_certificate /etc/nginx/ssl/muxvia.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/muxvia.com/privkey.pem;

    location = /healthz {
        proxy_pass http://127.0.0.1:42102/healthz;
    }

    location / {
        proxy_pass http://127.0.0.1:42101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
        client_max_body_size 4m;
    }
}
