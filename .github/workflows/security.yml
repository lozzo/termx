name: Linux and security

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install pinned protobuf tools
        shell: bash
        run: |
          protoc_archive="$RUNNER_TEMP/protoc-35.1-linux-x86_64.zip"
          protoc_root="$RUNNER_TEMP/protoc-35.1"
          curl --fail --location --silent --show-error \
            https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip \
            --output "$protoc_archive"
          echo "6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7  $protoc_archive" | sha256sum --check
          unzip -q "$protoc_archive" -d "$protoc_root"
          echo "$protoc_root/bin" >> "$GITHUB_PATH"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - run: npm ci

      - name: Repository doctor and tooling fixtures
        run: |
          make doctor
          scripts/test-repository-layout-guard.sh
          node --test scripts/eslint-config.test.mjs scripts/package-scripts.test.mjs

      - name: Go correctness and vulnerability gates
        run: |
          go test ./... -count=1
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.0-rc.1 -checks='SA*' ./...
          scripts/govulncheck.sh

      - name: JavaScript correctness and security gates
        run: |
          npm audit
          npm run test:i18n
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Cloud browser and accessibility gates
        run: |
          npm run test:e2e --workspace @anytty/cloud-web
          npm run test:axe --workspace @anytty/cloud-web

      - name: Android release gate
        run: |
          sdkmanager "ndk;27.2.12479018"
          scripts/test-android-apk-boundary.sh
          npm run cap:sync --workspace @anytty/mobile
          clients/mobile/android/gradlew --no-daemon --project-dir clients/mobile/android testDebugUnitTest assembleRelease
          scripts/verify-android-apk-boundary.sh clients/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Tracked generated files are current
        run: git diff --exit-code --
