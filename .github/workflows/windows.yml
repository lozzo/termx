name: Windows

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test-package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install protoc 35.1
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'protoc.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'protoc'
          Invoke-WebRequest 'https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-win64.zip' -OutFile $archive
          $digest = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($digest -ne '5d3ff218d7d91eea95f7569bcb5a98f3030f8996d44151279d9772edcff76082') {
            throw "protoc archive checksum mismatch: $digest"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          (Join-Path $destination 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - run: npm ci

      - name: Check Windows toolchain
        shell: powershell
        run: ./scripts/doctor-windows.ps1

      - name: Run Windows gates
        shell: powershell
        run: ./scripts/test-windows.ps1

      - name: Build Windows binaries
        shell: powershell
        run: ./scripts/build-windows.ps1 -Cloud

      - name: Package Windows client
        shell: powershell
        env:
          ANYTTY_PACKAGE_VERSION: ci-${{ github.sha }}
        run: ./scripts/package-windows.ps1 -Version $env:ANYTTY_PACKAGE_VERSION -SkipBuild

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anytty-windows-amd64
          path: .artifacts/packages/*.zip
          if-no-files-found: error
