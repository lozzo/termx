server {
    listen 80;
    server_name anytty.com www.anytty.com cloud.anytty.com controller.anytty.com;

    location ^~ /.well-known/acme-challenge/ {
        root /etc/nginx/conf.d/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name anytty.com www.anytty.com;

    ssl_certificate /etc/nginx/ssl/cloud.anytty.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/cloud.anytty.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://cloud.anytty.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name cloud.anytty.com;

    ssl_certificate /etc/nginx/ssl/cloud.anytty.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/cloud.anytty.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 0;

    # Cloud gRPC 是客户端到 Controller 的公开入口；EdgeControl 继续使用独立 mTLS listener。
    location ^~ /anytty.cloud.v1. {
        grpc_pass grpcs://127.0.0.1:18444;
        grpc_ssl_server_name on;
        grpc_ssl_name controller.anytty.com;
        grpc_ssl_verify off;
        grpc_set_header Host $host;
        grpc_read_timeout 3600s;
        grpc_send_timeout 3600s;
    }

    # Web、JSON API 和事件流共用 Controller 的 18444 listener，流式响应禁止代理缓冲。
    location / {
        proxy_pass https://127.0.0.1:18444;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name controller.anytty.com;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
